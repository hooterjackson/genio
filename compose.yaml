services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: needle
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: needle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - needle-postgres:/var/lib/postgresql/data

volumes:
  needle-postgres:
