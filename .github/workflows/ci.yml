name: checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm security:dependencies
      - run: pnpm lint
      - run: pnpm build

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:policy:check

  unit-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: needle
          POSTGRES_USER: needle
          POSTGRES_PASSWORD: needle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needle -d needle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://needle:needle@127.0.0.1:5432/needle
      APP_ORIGIN: http://localhost:3000
      RAILWAY_API_BASE: http://127.0.0.1:8788
      GATEWAY_KEY_ID: ci-v1
      GATEWAY_HMAC_SECRET: 0123456789abcdef0123456789abcdef
      IP_HASH_SECRET: abcdef0123456789abcdef0123456789
      CAPABILITY_PEPPER: fedcba9876543210fedcba9876543210
      CAPABILITY_PEPPER_VERSION: ci-capability-v1
      SESSION_SECRET: 00112233445566778899aabbccddeeff
      OWNER_EMAIL: owner@example.com
      OWNER_ALLOWLIST_VERSION: ci-owner-allowlist-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database:preflight
      - run: pnpm db:migrate
      - run: pnpm test:coverage
      - run: pnpm test:database
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

  production-database-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Match the immutable Postgres 18 image currently serving production.
        image: ghcr.io/railwayapp-templates/postgres-ssl:18@sha256:764fabc5fceb7166414c425a57bed8722a08cfb7fff508efb21a86eb31e172a6
        env:
          POSTGRES_DB: needle
          POSTGRES_USER: needle
          POSTGRES_PASSWORD: needle
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needle -d needle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://needle:needle@127.0.0.1:5432/needle
      APP_ORIGIN: http://localhost:3000
      RAILWAY_API_BASE: http://127.0.0.1:8788
      GATEWAY_KEY_ID: ci-v1
      GATEWAY_HMAC_SECRET: 0123456789abcdef0123456789abcdef
      IP_HASH_SECRET: abcdef0123456789abcdef0123456789
      CAPABILITY_PEPPER: fedcba9876543210fedcba9876543210
      CAPABILITY_PEPPER_VERSION: ci-capability-v1
      SESSION_SECRET: 00112233445566778899aabbccddeeff
      OWNER_EMAIL: owner@example.com
      OWNER_ALLOWLIST_VERSION: ci-owner-allowlist-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database:preflight
      - run: pnpm db:migrate
      - run: pnpm test:database

  browser:
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-320, mobile-390, mobile-430, desktop]
    env:
      OWNER_EMAIL: owner@example.com
      OWNER_ALLOWLIST_VERSION: ci-owner-allowlist-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  stitched-system:
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: needle
          POSTGRES_USER: needle
          POSTGRES_PASSWORD: needle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needle -d needle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://needle:needle@127.0.0.1:5432/needle
      APP_ORIGIN: http://localhost:3000
      RAILWAY_API_BASE: http://127.0.0.1:8788
      GATEWAY_KEY_ID: ci-system-v1
      GATEWAY_HMAC_SECRET: 0123456789abcdef0123456789abcdef
      IP_HASH_SECRET: abcdef0123456789abcdef0123456789
      CAPABILITY_PEPPER: fedcba9876543210fedcba9876543210
      CAPABILITY_PEPPER_VERSION: ci-system-capability-v1
      SESSION_SECRET: 00112233445566778899aabbccddeeff
      OWNER_EMAIL: owner@example.com
      OWNER_ALLOWLIST_VERSION: ci-system-owner-allowlist-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:database:preflight
      - run: pnpm db:migrate
      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - name: Run mandatory stitched API-worker-database-browser suite
        run: pnpm test:e2e:system
      - name: Upload stitched-system failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stitched-system
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  aggregate-exact-sha:
    name: aggregate exact-SHA gate
    if: always()
    needs:
      - static
      - policy
      - unit-and-database
      - production-database-compatibility
      - browser
      - stitched-system
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every exact-SHA gate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          SOURCE_REVISION: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          FAILURES="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | "\(.key)=\(.value.result)"
            ' <<<"$NEEDS_JSON"
          )"
          if [[ -n "$FAILURES" ]]; then
            echo "Exact-SHA aggregate gate failed:" >&2
            echo "$FAILURES" >&2
            exit 1
          fi
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "GitHub did not expose a full source SHA" >&2; exit 1; }
          jq -n \
            --arg schemaVersion "genio-exact-sha-ci/v1" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg event "$EVENT_NAME" \
            --arg headBranch "$HEAD_BRANCH" \
            --arg defaultBranch "$DEFAULT_BRANCH" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson gates "$NEEDS_JSON" \
            '{
              schemaVersion: $schemaVersion,
              sourceRevision: $sourceRevision,
              event: $event,
              headBranch: $headBranch,
              defaultBranch: $defaultBranch,
              runId: $runId,
              runAttempt: $runAttempt,
              runUrl: $runUrl,
              createdAt: $createdAt,
              gates: ($gates | with_entries(.value = .value.result))
            }' > exact-sha-ci-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-sha-ci-${{ github.sha }}
          path: exact-sha-ci-receipt.json
          if-no-files-found: error
          retention-days: 30
