name: v254 Sites connector handoff

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact merged v2.5.4 source revision deployed by Sites
        required: true
        type: string
      release_version:
        description: Exact candidate version
        required: true
        type: string
      candidate_tag:
        description: Immutable RC tag
        required: true
        type: string
      image_digest:
        description: Immutable backend image digest
        required: true
        type: string
      sites_control_plane_evidence_base64:
        description: Base64 connector-produced Sites deployment receipt
        required: true
        type: string
      sites_control_plane_attestation_base64:
        description: Base64 connector-signed Sites deployment attestation
        required: true
        type: string
      sites_control_plane_public_key_base64:
        description: Base64 connector verification public key
        required: true
        type: string

concurrency:
  group: v254-sites-connector-handoff-${{ inputs.source_revision }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: verify bounded connector evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_SITES_CONTROL_PLANE_TRUSTED_KEY_ID: ${{ vars.RELEASE_SITES_CONTROL_PLANE_KEY_ID }}
      RELEASE_SITES_CONTROL_PLANE_TRUSTED_KEY_SHA256: ${{ vars.RELEASE_SITES_CONTROL_PLANE_KEY_SHA256 }}
      SITES_PROJECT_ID: appgprj_6a5565cf7d6c8191ab9f2084e8eda856
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact immutable source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v"$RELEASE_VERSION"-rc\.[1-9][0-9]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SITES_CONTROL_PLANE_TRUSTED_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:+/-]{2,159}$ ]]
          [[ "$RELEASE_SITES_CONTROL_PLANE_TRUSTED_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Materialize bounded connector evidence
        env:
          SITES_EVIDENCE_BASE64: ${{ inputs.sites_control_plane_evidence_base64 }}
          SITES_ATTESTATION_BASE64: ${{ inputs.sites_control_plane_attestation_base64 }}
          SITES_PUBLIC_KEY_BASE64: ${{ inputs.sites_control_plane_public_key_base64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SITES_EVIDENCE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sites-control-plane.json"
          printf '%s' "$SITES_ATTESTATION_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sites-control-plane.attestation.json"
          printf '%s' "$SITES_PUBLIC_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sites-control-plane-public-key.pem"

      - name: Verify exact connector handoff
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          node --experimental-transform-types \
            scripts/v254-sites-connector-handoff.ts \
            --candidate-tag "$CANDIDATE_TAG" \
            --version "$RELEASE_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --image-digest "$IMAGE_DIGEST" \
            --project-id "$SITES_PROJECT_ID" \
            --sites-control-plane-evidence "$RUNNER_TEMP/sites-control-plane.json" \
            --sites-control-plane-attestation "$RUNNER_TEMP/sites-control-plane.attestation.json" \
            --sites-control-plane-public-key "$RUNNER_TEMP/sites-control-plane-public-key.pem" \
            --output "$RUNNER_TEMP/v254-sites-connector-handoff.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v254-sites-connector-handoff-${{ inputs.source_revision }}
          path: |
            ${{ runner.temp }}/v254-sites-connector-handoff.json
            ${{ runner.temp }}/sites-control-plane.json
            ${{ runner.temp }}/sites-control-plane.attestation.json
            ${{ runner.temp }}/sites-control-plane-public-key.pem
          if-no-files-found: error
          retention-days: 30
