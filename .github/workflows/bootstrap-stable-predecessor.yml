name: bootstrap stable predecessor v2.3.4

on:
  # Repository dispatch is deliberately used instead of workflow_dispatch.
  # GitHub loads this workflow from the default branch, so an operator cannot
  # select a branch containing a replacement verifier.
  repository_dispatch:
    types: [genio-stable-predecessor-bootstrap-v2-3-4]

concurrency:
  group: stable-release-mutation
  cancel-in-progress: false

permissions: {}

env:
  BOOTSTRAP_REPOSITORY: hooterjackson/genio
  BOOTSTRAP_WORKFLOW: .github/workflows/bootstrap-stable-predecessor.yml
  BOOTSTRAP_IMAGE_WORKFLOW: .github/workflows/bootstrap-stable-predecessor-image.yml
  STABLE_TAG: v2.3.4
  COMPATIBILITY_RC_TAG: v2.3.4-rc.1
  ORIGINAL_TAG_OBJECT: 0fb63ccc88b6f5ea675b3b43506fc112fa3fae58
  ORIGINAL_SOURCE_REVISION: 7dc877cfc1537a9936974f9699a4b8ba9740b5f5
  ORIGINAL_SOURCE_TREE: 91076c2f06de9d562532981c3a602f1c6366f057

jobs:
  verify_recovered_observation:
    environment: release-control-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_reference: ${{ steps.identity.outputs.image_reference }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
    steps:
      - id: control_auditor
        name: Mint the repository-scoped release control auditor
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_AUDITOR_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: controller
        name: Fence the protected default-branch bootstrap controller
        run: |
          test "$GITHUB_REPOSITORY" = "$BOOTSTRAP_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$BOOTSTRAP_WORKFLOW@refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git cat-file -t "$ORIGINAL_TAG_OBJECT")" = "tag"
          test "$(git rev-parse "$ORIGINAL_TAG_OBJECT^{}")" = "$ORIGINAL_SOURCE_REVISION"
          test "$(git rev-parse "$ORIGINAL_SOURCE_REVISION^{tree}")" = "$ORIGINAL_SOURCE_TREE"
          git merge-base --is-ancestor "$ORIGINAL_SOURCE_REVISION" "$GITHUB_SHA"
          node -e 'const cp=require("node:child_process"); const raw=cp.execFileSync("git",["cat-file","tag",process.env.ORIGINAL_TAG_OBJECT],{encoding:"utf8"}); const expected=`object ${process.env.ORIGINAL_SOURCE_REVISION}\ntype commit\ntag ${process.env.STABLE_TAG}\n`; if(!raw.startsWith(expected)||!raw.endsWith("\n\nRelease v2.3.4\n")) throw new Error("the fixed historical annotated tag object is not exact");'
      - id: protection
        name: Authorize read-only provenance recovery from exact GitHub controls
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BOOTSTRAP_AUTHORIZED_ACTOR: ${{ vars.STABLE_PREDECESSOR_BOOTSTRAP_ACTOR }}
          RELEASE_CONTROL_AUDITOR_APP_ID: >-
            ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          STABLE_RELEASE_WRITER_APP_ID: >-
            ${{ vars.STABLE_RELEASE_WRITER_APP_ID }}
          STABLE_TAG_RULESET_ID: ${{ vars.STABLE_TAG_RULESET_ID }}
        with:
          github-token: ${{ steps.control_auditor.outputs.token }}
          script: |
            const fail = (message) => {
              throw new Error(`stable predecessor bootstrap: ${message}`);
            };
            if (
              context.repo.owner.toLowerCase() !== "hooterjackson"
              || context.repo.repo !== "genio"
              || context.payload.repository?.fork !== false
              || context.ref
                !== `refs/heads/${context.payload.repository?.default_branch}`
              || context.sha !== process.env.GITHUB_SHA
              || process.env.GITHUB_WORKFLOW_SHA !== context.sha
            ) {
              fail("forked, non-default, or replayed controller");
            }
            const payload = context.payload.client_payload ?? {};
            const payloadKeys = Object.keys(payload).sort();
            const expectedPayloadKeys = [
              "finalization_evidence_b64url",
              "image_digest",
              "protected_baseline_metadata_b64url",
              "recovered_railway_observation_b64url",
              "stable_authorization_b64url",
            ];
            if (
              JSON.stringify(payloadKeys) !== JSON.stringify(expectedPayloadKeys)
              || payloadKeys.length > 10
              || Buffer.byteLength(JSON.stringify(payload), "utf8") >= 64 * 1024
              || !/^sha256:[0-9a-f]{64}$/u.test(payload.image_digest ?? "")
            ) {
              fail("dispatch has unexpected, oversized, or invalid inputs");
            }
            for (const key of expectedPayloadKeys.filter((key) =>
              key.endsWith("_b64url")
            )) {
              const value = payload[key];
              if (
                typeof value !== "string"
                || value.length > 24_000
                || !/^[0-9A-Za-z_-]+$/u.test(value)
              ) {
                fail(`${key} is not bounded canonical base64url`);
              }
              const bytes = Buffer.from(value, "base64url");
              if (
                bytes.length === 0
                || bytes.length > 18_000
                || bytes.toString("base64url") !== value
              ) {
                fail(`${key} is not bounded canonical base64url`);
              }
            }
            const authorizedActor =
              process.env.BOOTSTRAP_AUTHORIZED_ACTOR ?? "";
            if (
              !/^[0-9A-Za-z](?:[0-9A-Za-z-]{0,37}[0-9A-Za-z])?$/u
                .test(authorizedActor)
              || context.actor !== authorizedActor
            ) {
              fail("dispatcher is not the protected bootstrap authority");
            }
            const permission =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
            if (permission.data.permission !== "admin") {
              fail("bootstrap requires an exact repository administrator");
            }
            const defaultBranch = context.payload.repository.default_branch;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
            });
            if (!branch.data.protected || branch.data.commit.sha !== context.sha) {
              fail("controller is not the current protected default-branch head");
            }
            const protection = await github.rest.repos.getBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
            });
            const requiredChecks = [
              "static",
              "policy",
              "unit-and-database",
              "production-database-compatibility",
              "browser (mobile-320)",
              "browser (mobile-390)",
              "browser (mobile-430)",
              "browser (desktop)",
            ];
            const githubActionsApp = await github.rest.apps.getBySlug({
              app_slug: "github-actions",
            });
            const githubActionsAppId = Number(githubActionsApp.data.id);
            const controlAuditorAppId =
              Number(process.env.RELEASE_CONTROL_AUDITOR_APP_ID);
            const stableWriterAppId =
              Number(process.env.STABLE_RELEASE_WRITER_APP_ID);
            if (
              githubActionsApp.data.slug !== "github-actions"
              || !Number.isSafeInteger(githubActionsAppId)
              || githubActionsAppId <= 0
              || !Number.isSafeInteger(stableWriterAppId)
              || stableWriterAppId <= 0
              || !Number.isSafeInteger(controlAuditorAppId)
              || controlAuditorAppId <= 0
              || new Set([
                githubActionsAppId,
                controlAuditorAppId,
                stableWriterAppId,
              ]).size !== 3
            ) {
              fail("GitHub Actions, auditor, or stable writer Integration identity is invalid");
            }
            const configuredChecks =
              protection.data.required_status_checks?.checks ?? [];
            if (
              protection.data.required_status_checks?.strict !== true
              || configuredChecks.length !== requiredChecks.length
              || requiredChecks.some((name) =>
                !configuredChecks.some((check) =>
                  check.context === name
                  && Number(check.app_id) === githubActionsAppId
                )
              )
              || protection.data.enforce_admins?.enabled !== true
            ) {
              fail(
                "branch protection lacks exact app-bound checks, approval, or admin enforcement",
              );
            }
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                filter: "latest",
                per_page: 100,
              },
            );
            if (requiredChecks.some((name) => {
              const matches = checkRuns.filter((run) => run.name === name);
              return matches.length !== 1
                || Number(matches[0]?.app?.id) !== githubActionsAppId
                || matches[0]?.status !== "completed"
                || matches[0]?.conclusion !== "success";
            })) {
              fail("controller does not have exact successful app-bound checks");
            }
            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );
            const mergedPulls = associatedPulls.filter((pull) =>
              pull.merged_at
              && pull.base?.ref === defaultBranch
              && pull.merge_commit_sha === context.sha
            );
            if (mergedPulls.length !== 1) {
              fail("controller is not one exact reviewed default-branch merge");
            }
            for (const environmentName of [
              "release-control-audit",
              "stable-predecessor-bootstrap",
            ]) {
              const environment = await github.request(
                "GET /repos/{owner}/{repo}/environments/{environment_name}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: environmentName,
                },
              );
              const reviewerRule = (environment.data.protection_rules ?? [])
                .find((rule) => rule.type === "required_reviewers");
              if (
                environment.data.name !== environmentName
                || environment.data.deployment_branch_policy?.protected_branches
                  !== true
                || environment.data.deployment_branch_policy
                  ?.custom_branch_policies !== false
                || !reviewerRule
                || !Array.isArray(reviewerRule.reviewers)
                || reviewerRule.reviewers.length !== 1
                || reviewerRule.reviewers[0]?.type !== "User"
                || reviewerRule.reviewers[0]?.reviewer?.login?.toLowerCase()
                  !== context.repo.owner.toLowerCase()
                || environment.data.prevent_self_review === true
                || reviewerRule.prevent_self_review === true
              ) {
                fail(`${environmentName} lacks exact solo-owner manual approval`);
              }
            }
            const immutableReleases = await github.request(
              "GET /repos/{owner}/{repo}/immutable-releases",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              },
            );
            if (immutableReleases.data.enabled !== true) {
              fail("repository immutable releases are not enabled");
            }
            const rulesetId = Number(process.env.STABLE_TAG_RULESET_ID);
            if (!Number.isSafeInteger(rulesetId) || rulesetId <= 0) {
              fail("protected stable tag ruleset identity is missing");
            }
            const ruleset = await github.request(
              "GET /repos/{owner}/{repo}/rulesets/{ruleset_id}",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ruleset_id: rulesetId,
              },
            );
            const ruleTypes = (ruleset.data.rules ?? [])
              .map(({ type }) => type)
              .sort();
            const bypassActors = ruleset.data.bypass_actors ?? [];
            if (
              ruleset.data.target !== "tag"
              || ruleset.data.enforcement !== "active"
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.include ?? [])].sort(),
              ) !== JSON.stringify(["refs/tags/v*"])
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.exclude ?? [])].sort(),
              ) !== JSON.stringify(["refs/tags/v*-rc.*"])
              || JSON.stringify(ruleTypes)
                !== JSON.stringify(["creation", "deletion", "update"])
              || bypassActors.length !== 1
              || bypassActors[0]?.actor_type !== "Integration"
              || Number(bypassActors[0]?.actor_id) !== stableWriterAppId
              || bypassActors[0]?.bypass_mode !== "always"
            ) {
              fail("stable tag ruleset is not exact");
            }
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/v2.3.4",
            });
            if (
              tagRef.data.object.type !== "tag"
              || tagRef.data.object.sha
                !== "0fb63ccc88b6f5ea675b3b43506fc112fa3fae58"
            ) {
              fail("v2.3.4 ref does not resolve to the fixed annotated tag object");
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: "0fb63ccc88b6f5ea675b3b43506fc112fa3fae58",
            });
            if (
              tag.data.tag !== "v2.3.4"
              || tag.data.object.type !== "commit"
              || tag.data.object.sha
                !== "7dc877cfc1537a9936974f9699a4b8ba9740b5f5"
              || tag.data.message !== "Release v2.3.4\n"
            ) {
              fail("v2.3.4 annotated tag is not the exact historical object");
            }
            const commit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: "7dc877cfc1537a9936974f9699a4b8ba9740b5f5",
            });
            if (
              commit.data.tree.sha
                !== "91076c2f06de9d562532981c3a602f1c6366f057"
            ) {
              fail("v2.3.4 source tree is not exact");
            }
            const ancestry = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead:
                "7dc877cfc1537a9936974f9699a4b8ba9740b5f5..."
                + context.sha,
            });
            if (
              ancestry.data.status !== "ahead"
              || ancestry.data.merge_base_commit?.sha
                !== "7dc877cfc1537a9936974f9699a4b8ba9740b5f5"
            ) {
              fail("bootstrap controller is not a descendant of v2.3.4");
            }
            const tagRefs = await github.paginate(
              github.rest.git.listMatchingRefs,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              },
            );
            const stableRefs = tagRefs.flatMap((ref) => {
              const match =
                /^refs\/tags\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u
                  .exec(ref.ref ?? "");
              return match
                ? [{
                    ref,
                    version: [
                      BigInt(match[1]),
                      BigInt(match[2]),
                      BigInt(match[3]),
                    ],
                  }]
                : [];
            });
            stableRefs.sort((left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left.version[index] > right.version[index]) return -1;
                if (left.version[index] < right.version[index]) return 1;
              }
              return 0;
            });
            if (stableRefs[0]?.ref?.ref !== "refs/tags/v2.3.4") {
              fail("v2.3.4 is no longer the greatest stable tag");
            }
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              },
            );
            const hasSuccessorOrLaterStable = releases.some((release) => {
              const match =
                /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u
                  .exec(release.tag_name ?? "");
              if (!match) return false;
              const version = [
                BigInt(match[1]),
                BigInt(match[2]),
                BigInt(match[3]),
              ];
              const predecessor = [2n, 3n, 4n];
              for (let index = 0; index < 3; index += 1) {
                if (version[index] > predecessor[index]) return true;
                if (version[index] < predecessor[index]) return false;
              }
              return false;
            });
            if (hasSuccessorOrLaterStable) {
              fail("a normal v2.4.0 or later stable release already exists");
            }
            const existing = releases.filter((release) =>
              release.tag_name === "v2.3.4"
            );
            if (
              existing.length > 1
              || (
                existing.length === 1
                && (
                  existing[0].name !== "v2.3.4"
                  || existing[0].target_commitish
                    !== "7dc877cfc1537a9936974f9699a4b8ba9740b5f5"
                  || existing[0].prerelease !== false
                  || (!existing[0].draft && existing[0].immutable !== true)
                )
              )
            ) {
              fail("existing v2.3.4 release has an incompatible identity");
            }
            core.setOutput("github_actions_app_id", String(githubActionsAppId));
            core.setOutput("stable_writer_app_id", String(stableWriterAppId));
            core.setOutput("stable_tag_ruleset_id", String(rulesetId));
      - id: identity
        name: Resolve the recovered immutable image identity
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node -e 'const fs=require("node:fs"); const digest=process.env.EXPECTED_IMAGE_DIGEST??""; if(!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error("expected image digest is invalid"); const name=`ghcr.io/${process.env.REPOSITORY_OWNER.toLowerCase()}/genio`; fs.appendFileSync(process.env.GITHUB_OUTPUT,`image_name=${name}\nimage_reference=${name}@${digest}\n`);'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Validate the authenticated Railway observation and reduced claim
        env:
          RECOVERED_RAILWAY_OBSERVATION_B64URL: ${{ github.event.client_payload.recovered_railway_observation_b64url }}
        run: |
          node -e 'const fs=require("node:fs"); const value=process.env.RECOVERED_RAILWAY_OBSERVATION_B64URL??""; if(!/^[0-9A-Za-z_-]+$/.test(value)||value.length>24000) throw new Error("recovered Railway observation is not bounded canonical base64url"); const bytes=Buffer.from(value,"base64url"); if(bytes.length===0||bytes.length>18000||bytes.toString("base64url")!==value) throw new Error("recovered Railway observation is empty, oversized, or noncanonical"); JSON.parse(bytes.toString("utf8")); fs.writeFileSync("recovered-railway-observation.json",bytes,{mode:0o600,flag:"wx"});'
          node --experimental-transform-types --input-type=module -e 'import fs from "node:fs"; import { validateStablePredecessorRecoveredRailwayObservationV1 } from "./scripts/stable-predecessor-bootstrap.ts"; const recovered=validateStablePredecessorRecoveredRailwayObservationV1(JSON.parse(fs.readFileSync("recovered-railway-observation.json","utf8"))); if(recovered.kind!=="authenticated_platform_observation_not_supply_chain_attestation"||recovered.capture.registryReferenceRecovered!==false||recovered.capture.manifestBytesRecovered!==false||recovered.capture.supplyChainAttestationRecovered!==false) throw new Error("Railway observation overclaims its recovered evidence");'

  verify_and_seal:
    needs: [verify_recovered_observation]
    environment: release-control-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      mutation_manifest_sha256: ${{ steps.mutation_manifest.outputs.sha256 }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
      IMAGE_REFERENCE: ${{ needs.verify_recovered_observation.outputs.image_reference }}
    steps:
      - id: control_auditor
        name: Mint the repository-scoped release control auditor
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_AUDITOR_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Re-fence the exact protected bootstrap controller
        run: |
          test "$GITHUB_REPOSITORY" = "$BOOTSTRAP_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$BOOTSTRAP_WORKFLOW@refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$IMAGE_REFERENCE" = "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/genio@$EXPECTED_IMAGE_DIGEST"
          test "$(git cat-file -t "$ORIGINAL_TAG_OBJECT")" = "tag"
          test "$(git rev-parse "$ORIGINAL_TAG_OBJECT^{}")" = "$ORIGINAL_SOURCE_REVISION"
          test "$(git rev-parse "$ORIGINAL_SOURCE_REVISION^{tree}")" = "$ORIGINAL_SOURCE_TREE"
          git merge-base --is-ancestor "$ORIGINAL_SOURCE_REVISION" "$GITHUB_SHA"
      - name: Materialize exact Git object and controller workflow bytes
        run: |
          mkdir bootstrap-source-bytes
          git cat-file tag "$ORIGINAL_TAG_OBJECT" \
            > bootstrap-source-bytes/tag-object
          git cat-file commit "$ORIGINAL_SOURCE_REVISION" \
            > bootstrap-source-bytes/source-commit
          git cat-file tree "$ORIGINAL_SOURCE_TREE" \
            > bootstrap-source-bytes/source-tree
          git show "$GITHUB_SHA:$BOOTSTRAP_WORKFLOW" \
            > bootstrap-source-bytes/controller-workflow.yml
          test -s bootstrap-source-bytes/tag-object
          test -s bootstrap-source-bytes/source-commit
          test -s bootstrap-source-bytes/source-tree
          test -s bootstrap-source-bytes/controller-workflow.yml
      - id: protection
        name: Reauthorize the exact GitHub controls before Release writes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BOOTSTRAP_AUTHORIZED_ACTOR: ${{ vars.STABLE_PREDECESSOR_BOOTSTRAP_ACTOR }}
          RELEASE_CONTROL_AUDITOR_APP_ID: >-
            ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          STABLE_RELEASE_WRITER_APP_ID: >-
            ${{ vars.STABLE_RELEASE_WRITER_APP_ID }}
          STABLE_TAG_RULESET_ID: ${{ vars.STABLE_TAG_RULESET_ID }}
        with:
          github-token: ${{ steps.control_auditor.outputs.token }}
          script: |
            const fail = (message) => {
              throw new Error(`stable predecessor bootstrap recheck: ${message}`);
            };
            const payload = context.payload.client_payload ?? {};
            const expectedPayloadKeys = [
              "finalization_evidence_b64url",
              "image_digest",
              "protected_baseline_metadata_b64url",
              "recovered_railway_observation_b64url",
              "stable_authorization_b64url",
            ];
            if (
              context.repo.owner.toLowerCase() !== "hooterjackson"
              || context.repo.repo !== "genio"
              || context.payload.repository?.fork !== false
              || context.ref
                !== `refs/heads/${context.payload.repository?.default_branch}`
              || context.sha !== process.env.GITHUB_SHA
              || process.env.GITHUB_WORKFLOW_SHA !== context.sha
