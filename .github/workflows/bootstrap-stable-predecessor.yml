          node -e 'const fs=require("node:fs"); const numeric=(value)=>/^[1-9]\d*$/.test(value??""); if(!numeric(process.env.VERIFIED_GITHUB_ACTIONS_APP_ID)||!numeric(process.env.VERIFIED_STABLE_TAG_RULESET_ID)) throw new Error("verified GitHub control identities are missing"); const lines=["gênio wrapper-backed stable predecessor v2.3.4","","Compatibility-RC: v2.3.4-rc.1",`Original-Tag-Object: ${process.env.ORIGINAL_TAG_OBJECT}`,`Original-Source-Revision: ${process.env.ORIGINAL_SOURCE_REVISION}`,`Original-Source-Tree: ${process.env.ORIGINAL_SOURCE_TREE}`,`Wrapper-Image-Digest: ${process.env.EXPECTED_IMAGE_DIGEST}`,"Railway-Observation-Kind: authenticated_platform_observation_not_supply_chain_attestation","Wrapper-Limitation: not historical Railway artifact",`Bootstrap-Evidence-SHA256: ${process.env.BOOTSTRAP_EVIDENCE_HASH}`,`Protected-Semantic-Baseline-SHA256: ${process.env.BASELINE_HASH}`,`Bootstrap-Authorization-SHA256: ${process.env.BOOTSTRAP_AUTHORIZATION_HASH}`,`Bootstrap-Controller-Revision: ${process.env.GITHUB_SHA}`,`Bootstrap-Workflow: ${process.env.GITHUB_REPOSITORY}/${process.env.BOOTSTRAP_WORKFLOW}`,`Tag-Ruleset-ID: ${process.env.VERIFIED_STABLE_TAG_RULESET_ID}`,`Tag-Bypass-Integration-ID: ${process.env.VERIFIED_GITHUB_ACTIONS_APP_ID}`,""]; fs.writeFileSync("stable-predecessor-release-notes.txt",lines.join("\n"),{mode:0o600,flag:"wx"});'
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
            > stable-release-api.json 2>/dev/null; then
            gh release create "$STABLE_TAG" \
              --draft \
              --verify-tag \
              --target "$ORIGINAL_SOURCE_REVISION" \
              --title "$STABLE_TAG" \
              --notes-file stable-predecessor-release-notes.txt
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
            > stable-release-api.json
          node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("stable-release-api.json","utf8")); const expectedBody=fs.readFileSync("stable-predecessor-release-notes.txt","utf8"); if(release.tag_name!==process.env.STABLE_TAG||release.target_commitish!==process.env.ORIGINAL_SOURCE_REVISION||release.name!==process.env.STABLE_TAG||release.body!==expectedBody||release.prerelease||(!release.draft&&release.immutable!==true)) throw new Error("v2.3.4 Release identity or body is not exact");'
          mkdir existing-release-assets
          for ASSET in \
            finalization-evidence.json \
            protected-semantic-baseline.json \
            stable-authorization.json \
            stable-image-attestation.json \
            stable-release-consumer.json; do
            if ASSET_NAME="$ASSET" node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("stable-release-api.json","utf8")); process.exit((release.assets??[]).some(({name})=>name===process.env.ASSET_NAME)?0:1)'; then
              gh release download "$STABLE_TAG" \
                --dir existing-release-assets \
                --pattern "$ASSET" \
                --clobber
            fi
          done
          node --experimental-transform-types scripts/stable-release-assets.ts \
            --release stable-release-api.json \
            --expected-directory . \
            --downloaded-directory existing-release-assets \
            --output stable-release-asset-plan.json
          if node -e 'const fs=require("node:fs"); const plan=JSON.parse(fs.readFileSync("stable-release-asset-plan.json","utf8")); process.exit(plan.missing.length+plan.replace.length>0?0:1)'; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
              > stable-release-before-reconcile.json
            node -e 'const fs=require("node:fs"); const before=JSON.parse(fs.readFileSync("stable-release-api.json","utf8")); const current=JSON.parse(fs.readFileSync("stable-release-before-reconcile.json","utf8")); const plan=JSON.parse(fs.readFileSync("stable-release-asset-plan.json","utf8")); if(current.id!==before.id||current.id!==plan.releaseId||current.tag_name!==before.tag_name||current.target_commitish!==before.target_commitish||current.name!==before.name||current.body!==before.body||current.prerelease||!current.draft) throw new Error("v2.3.4 left the exact draft state before asset reconciliation");'
            for ASSET in $(node -e 'const fs=require("node:fs"); const plan=JSON.parse(fs.readFileSync("stable-release-asset-plan.json","utf8")); process.stdout.write(plan.replace.join("\n"))'); do
              gh release delete-asset "$STABLE_TAG" "$ASSET" --yes
              gh release upload "$STABLE_TAG" "$ASSET"
            done
            for ASSET in $(node -e 'const fs=require("node:fs"); const plan=JSON.parse(fs.readFileSync("stable-release-asset-plan.json","utf8")); process.stdout.write(plan.missing.join("\n"))'); do
              gh release upload "$STABLE_TAG" "$ASSET"
            done
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
            > stable-release-api.json
          node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("stable-release-api.json","utf8")); const expectedBody=fs.readFileSync("stable-predecessor-release-notes.txt","utf8"); const expectedAssets=["finalization-evidence.json","protected-semantic-baseline.json","stable-authorization.json","stable-image-attestation.json","stable-release-consumer.json"]; const actualAssets=(release.assets??[]).map(({name})=>name).sort(); if(release.tag_name!==process.env.STABLE_TAG||release.target_commitish!==process.env.ORIGINAL_SOURCE_REVISION||release.name!==process.env.STABLE_TAG||release.body!==expectedBody||release.prerelease||JSON.stringify(actualAssets)!==JSON.stringify(expectedAssets)) throw new Error("v2.3.4 Release identity, body, or exact five assets differ");'
          mkdir exact-release-assets
          gh release download "$STABLE_TAG" \
            --dir exact-release-assets \
            --pattern finalization-evidence.json \
            --pattern protected-semantic-baseline.json \
            --pattern stable-authorization.json \
            --pattern stable-image-attestation.json \
            --pattern stable-release-consumer.json
          cmp finalization-evidence.json exact-release-assets/finalization-evidence.json
          cmp protected-semantic-baseline.json exact-release-assets/protected-semantic-baseline.json
          cmp stable-authorization.json exact-release-assets/stable-authorization.json
          cmp stable-image-attestation.json exact-release-assets/stable-image-attestation.json
          cmp stable-release-consumer.json exact-release-assets/stable-release-consumer.json
          node --experimental-transform-types scripts/stable-release-assets.ts \
            --release stable-release-api.json \
            --expected-directory . \
            --downloaded-directory exact-release-assets \
            --output stable-release-final-asset-plan.json
          node -e 'const fs=require("node:fs"); const plan=JSON.parse(fs.readFileSync("stable-release-final-asset-plan.json","utf8")); if(plan.missing.length||plan.replace.length||plan.verified.length!==5) throw new Error("v2.3.4 five-asset reconciliation did not converge exactly");'
          if node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("stable-release-api.json","utf8")); process.exit(release.draft?0:1)'; then
            gh release edit "$STABLE_TAG" --draft=false
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
            > published-stable-release-api.json
          node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("published-stable-release-api.json","utf8")); const expectedBody=fs.readFileSync("stable-predecessor-release-notes.txt","utf8"); const expectedAssets=["finalization-evidence.json","protected-semantic-baseline.json","stable-authorization.json","stable-image-attestation.json","stable-release-consumer.json"]; const actualAssets=(release.assets??[]).map(({name})=>name).sort(); if(release.tag_name!==process.env.STABLE_TAG||release.target_commitish!==process.env.ORIGINAL_SOURCE_REVISION||release.name!==process.env.STABLE_TAG||release.body!==expectedBody||release.draft||release.prerelease||release.immutable!==true||JSON.stringify(actualAssets)!==JSON.stringify(expectedAssets)) throw new Error("v2.3.4 GitHub Release is not exact, published, and immutable");'
