          const { readFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const root = "stable-predecessor-mutation";
          const names = [
            "finalization-evidence.json",
            "protected-semantic-baseline.json",
            "stable-authorization.json",
            "stable-image-attestation.json",
            "stable-release-consumer.json",
            "stable-predecessor-release-notes.txt",
          ];
          const assets = {};
          for (const name of names) {
            const bytes = readFileSync(join(root, name));
            if (bytes.length <= 0 || bytes.length > 2 * 1024 * 1024) {
              throw new Error(`bootstrap mutation input ${name} is empty or oversized`);
            }
            assets[name] = {
              size: bytes.length,
              sha256: createHash("sha256").update(bytes).digest("hex"),
            };
          }
          const numeric = (value) => /^[1-9]\d*$/u.test(value ?? "");
          if (
            !numeric(process.env.CONTROL_AUDITOR_APP_ID)
            || !numeric(process.env.STABLE_WRITER_APP_ID)
            || !numeric(process.env.STABLE_TAG_RULESET_ID)
            || new Set([
              process.env.CONTROL_AUDITOR_APP_ID,
              process.env.STABLE_WRITER_APP_ID,
            ]).size !== 2
          ) {
            throw new Error("bootstrap App or ruleset identities are invalid");
          }
          const manifest = {
            schemaVersion: "genio-stable-predecessor-mutation/v1",
            repository: process.env.GITHUB_REPOSITORY,
            workflowSha: process.env.GITHUB_SHA,
            stableTag: process.env.STABLE_TAG,
            originalTagObject: process.env.ORIGINAL_TAG_OBJECT,
            originalSourceRevision: process.env.ORIGINAL_SOURCE_REVISION,
            originalSourceTree: process.env.ORIGINAL_SOURCE_TREE,
            imageDigest: process.env.EXPECTED_IMAGE_DIGEST,
            controlAuditorAppId: Number(process.env.CONTROL_AUDITOR_APP_ID),
            stableWriterAppId: Number(process.env.STABLE_WRITER_APP_ID),
            stableTagRulesetId: Number(process.env.STABLE_TAG_RULESET_ID),
            assets,
          };
          const path = join(root, "stable-predecessor-mutation-manifest.json");
          const bytes = Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`);
          if (bytes.length > 64 * 1024) {
            throw new Error("bootstrap mutation manifest is oversized");
          }
          writeFileSync(path, bytes, { flag: "wx", mode: 0o600 });
          require("node:fs").appendFileSync(
            process.env.GITHUB_OUTPUT,
            `sha256=${createHash("sha256").update(bytes).digest("hex")}\n`,
          );
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-predecessor-mutation
          path: stable-predecessor-mutation
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  final_reauthorize:
    needs: [verify_and_seal]
    environment: release-control-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      control_receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
      MUTATION_MANIFEST_SHA256: ${{ needs.verify_and_seal.outputs.mutation_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-predecessor-mutation
          path: stable-predecessor-mutation
      - name: Verify the sealed bootstrap mutation manifest
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, readdirSync } = require("node:fs");
          const { join } = require("node:path");
          const root = "stable-predecessor-mutation";
          const expectedNames = [
            "finalization-evidence.json",
            "protected-semantic-baseline.json",
            "stable-authorization.json",
            "stable-image-attestation.json",
            "stable-predecessor-mutation-manifest.json",
            "stable-predecessor-release-notes.txt",
            "stable-release-consumer.json",
          ];
          if (
            JSON.stringify(readdirSync(root).sort())
              !== JSON.stringify(expectedNames)
          ) {
            throw new Error("sealed bootstrap mutation inventory changed");
          }
          const manifestBytes = readFileSync(
            join(root, "stable-predecessor-mutation-manifest.json"),
          );
          const sha = (bytes) =>
            createHash("sha256").update(bytes).digest("hex");
          if (sha(manifestBytes) !== process.env.MUTATION_MANIFEST_SHA256) {
            throw new Error("sealed bootstrap mutation manifest changed");
          }
          const manifest = JSON.parse(manifestBytes);
          if (
            manifest.schemaVersion !== "genio-stable-predecessor-mutation/v1"
            || manifest.repository !== process.env.GITHUB_REPOSITORY
            || manifest.workflowSha !== process.env.GITHUB_SHA
            || manifest.stableTag !== process.env.STABLE_TAG
            || manifest.originalTagObject !== process.env.ORIGINAL_TAG_OBJECT
            || manifest.originalSourceRevision
              !== process.env.ORIGINAL_SOURCE_REVISION
            || manifest.originalSourceTree !== process.env.ORIGINAL_SOURCE_TREE
            || manifest.imageDigest !== process.env.EXPECTED_IMAGE_DIGEST
          ) {
            throw new Error("sealed bootstrap mutation identity changed");
          }
          for (const [name, expected] of Object.entries(manifest.assets)) {
            const bytes = readFileSync(join(root, name));
            if (
              bytes.length <= 0
              || bytes.length > 2 * 1024 * 1024
              || bytes.length !== expected.size
              || sha(bytes) !== expected.sha256
            ) {
              throw new Error(`sealed bootstrap input ${name} changed`);
            }
          }
          NODE
      - id: control_auditor
        name: Mint the repository-scoped release control auditor
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_AUDITOR_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - name: Reauthorize every control and seal the exact mutation plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BOOTSTRAP_AUTHORIZED_ACTOR: ${{ vars.STABLE_PREDECESSOR_BOOTSTRAP_ACTOR }}
          RELEASE_CONTROL_AUDITOR_APP_ID: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          STABLE_RELEASE_WRITER_APP_ID: ${{ vars.STABLE_RELEASE_WRITER_APP_ID }}
          STABLE_TAG_RULESET_ID: ${{ vars.STABLE_TAG_RULESET_ID }}
        with:
          github-token: ${{ steps.control_auditor.outputs.token }}
          script: |
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync } = require("node:fs");
            const fail = (message) => {
              throw new Error(`stable predecessor final authorization: ${message}`);
            };
            if (
              context.repo.owner.toLowerCase() !== "hooterjackson"
              || context.repo.repo !== "genio"
              || context.payload.repository?.fork !== false
              || context.ref !== `refs/heads/${process.env.DEFAULT_BRANCH}`
              || context.sha !== process.env.GITHUB_SHA
              || process.env.GITHUB_WORKFLOW_SHA !== context.sha
              || context.actor !== process.env.BOOTSTRAP_AUTHORIZED_ACTOR
            ) {
              fail("repository, actor, controller, or default branch changed");
            }
            const permission =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: process.env.DEFAULT_BRANCH,
            });
            const protection = await github.rest.repos.getBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: process.env.DEFAULT_BRANCH,
            });
            const requiredChecks = [
              "static",
              "policy",
              "unit-and-database",
              "production-database-compatibility",
              "browser (mobile-320)",
              "browser (mobile-390)",
              "browser (mobile-430)",
              "browser (desktop)",
            ];
            const githubActionsApp = await github.rest.apps.getBySlug({
              app_slug: "github-actions",
            });
            const githubActionsAppId = Number(githubActionsApp.data.id);
            const controlAuditorAppId =
              Number(process.env.RELEASE_CONTROL_AUDITOR_APP_ID);
            const stableWriterAppId =
              Number(process.env.STABLE_RELEASE_WRITER_APP_ID);
            const configuredChecks =
              protection.data.required_status_checks?.checks ?? [];
            if (
              permission.data.permission !== "admin"
              || !branch.data.protected
              || branch.data.commit.sha !== context.sha
              || githubActionsApp.data.slug !== "github-actions"
              || !Number.isSafeInteger(githubActionsAppId)
              || !Number.isSafeInteger(controlAuditorAppId)
              || !Number.isSafeInteger(stableWriterAppId)
              || Math.min(
                githubActionsAppId,
                controlAuditorAppId,
                stableWriterAppId,
              ) <= 0
              || new Set([
                githubActionsAppId,
                controlAuditorAppId,
                stableWriterAppId,
              ]).size !== 3
              || protection.data.required_status_checks?.strict !== true
              || configuredChecks.length !== requiredChecks.length
              || requiredChecks.some((name) =>
                !configuredChecks.some((check) =>
                  check.context === name
                  && Number(check.app_id) === githubActionsAppId
                )
              )
              || protection.data.enforce_admins?.enabled !== true
              || protection.data.required_conversation_resolution?.enabled
                !== true
              || protection.data.allow_force_pushes?.enabled !== false
              || protection.data.allow_deletions?.enabled !== false
            ) {
              fail("protected controller or App identities changed");
            }
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                filter: "latest",
                per_page: 100,
              },
            );
            if (requiredChecks.some((name) => {
              const matches = checkRuns.filter((run) => run.name === name);
              return matches.length !== 1
                || Number(matches[0]?.app?.id) !== githubActionsAppId
                || matches[0]?.status !== "completed"
                || matches[0]?.conclusion !== "success";
            })) {
              fail("controller check results changed");
            }
            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );
            const mergedPulls = associatedPulls.filter((pull) =>
              pull.merged_at
              && pull.base?.ref === process.env.DEFAULT_BRANCH
              && pull.merge_commit_sha === context.sha
            );
            if (mergedPulls.length !== 1) {
              fail("controller is not one exact reviewed default-branch merge");
            }
            for (const environmentName of [
              "release-control-audit",
              "stable-predecessor-bootstrap",
            ]) {
              const environment = await github.request(
                "GET /repos/{owner}/{repo}/environments/{environment_name}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: environmentName,
                },
              );
              const reviewerRule = (environment.data.protection_rules ?? [])
                .find((rule) => rule.type === "required_reviewers");
              if (
                environment.data.name !== environmentName
                || environment.data.deployment_branch_policy?.protected_branches
                  !== true
                || environment.data.deployment_branch_policy
                  ?.custom_branch_policies !== false
                || !reviewerRule
                || !Array.isArray(reviewerRule.reviewers)
                || reviewerRule.reviewers.length !== 1
                || reviewerRule.reviewers[0]?.type !== "User"
                || reviewerRule.reviewers[0]?.reviewer?.login?.toLowerCase()
                  !== context.repo.owner.toLowerCase()
                || environment.data.prevent_self_review === true
                || reviewerRule.prevent_self_review === true
              ) {
                fail(`${environmentName} controls changed`);
              }
            }
            const immutableReleases = await github.request(
              "GET /repos/{owner}/{repo}/immutable-releases",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              },
            );
            const rulesetId = Number(process.env.STABLE_TAG_RULESET_ID);
            const ruleset = await github.request(
              "GET /repos/{owner}/{repo}/rulesets/{ruleset_id}",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ruleset_id: rulesetId,
              },
            );
            const ruleTypes = (ruleset.data.rules ?? [])
              .map(({ type }) => type)
              .sort();
            const bypassActors = ruleset.data.bypass_actors ?? [];
            if (
              immutableReleases.data.enabled !== true
              || !Number.isSafeInteger(rulesetId)
              || rulesetId <= 0
              || ruleset.data.target !== "tag"
              || ruleset.data.enforcement !== "active"
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.include ?? [])].sort(),
              ) !== JSON.stringify(["refs/tags/v*"])
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.exclude ?? [])].sort(),
              ) !== JSON.stringify(["refs/tags/v*-rc.*"])
              || JSON.stringify(ruleTypes)
                !== JSON.stringify(["creation", "deletion", "update"])
              || bypassActors.length !== 1
              || bypassActors[0]?.actor_type !== "Integration"
              || Number(bypassActors[0]?.actor_id) !== stableWriterAppId
              || bypassActors[0]?.bypass_mode !== "always"
            ) {
              fail("immutable-release or stable-tag ruleset controls changed");
            }
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/v2.3.4",
            });
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: process.env.ORIGINAL_TAG_OBJECT,
            });
            const commit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.ORIGINAL_SOURCE_REVISION,
            });
            if (
              tagRef.data.object.type !== "tag"
              || tagRef.data.object.sha !== process.env.ORIGINAL_TAG_OBJECT
              || tag.data.tag !== process.env.STABLE_TAG
              || tag.data.object.type !== "commit"
              || tag.data.object.sha !== process.env.ORIGINAL_SOURCE_REVISION
              || tag.data.message !== "Release v2.3.4\n"
              || commit.data.tree.sha !== process.env.ORIGINAL_SOURCE_TREE
            ) {
              fail("historical annotated tag, target, or tree changed");
            }
            const tuple = (value) => {
              const match =
                /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.exec(value ?? "");
              return match ? match.slice(1).map(BigInt) : null;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            };
            const [refs, releases] = await Promise.all([
              github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              }),
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
            ]);
            const target = [2n, 3n, 4n];
            const stableRefs = refs.flatMap((ref) => {
              const version = tuple(ref.ref?.replace(/^refs\/tags\//u, ""));
              return version ? [{ ref, version }] : [];
            }).sort((left, right) => compare(right.version, left.version));
            if (
              stableRefs[0]?.ref?.ref !== "refs/tags/v2.3.4"
              || stableRefs.some(({ version }) => compare(version, target) > 0)
              || releases.some((release) => {
                const version = tuple(release.tag_name);
                return version && compare(version, target) > 0;
              })
            ) {
              fail("one-time v2.3.4 bootstrap reachability closed");
            }
            const manifest = JSON.parse(readFileSync(
              "stable-predecessor-mutation/stable-predecessor-mutation-manifest.json",
              "utf8",
            ));
            if (
              manifest.controlAuditorAppId !== controlAuditorAppId
              || manifest.stableWriterAppId !== stableWriterAppId
              || manifest.stableTagRulesetId !== rulesetId
            ) {
              fail("sealed App or ruleset identities changed");
            }
            const expectedBody = readFileSync(
              "stable-predecessor-mutation/stable-predecessor-release-notes.txt",
              "utf8",
            );
            const expectedNames = [
              "finalization-evidence.json",
              "protected-semantic-baseline.json",
              "stable-authorization.json",
              "stable-image-attestation.json",
              "stable-release-consumer.json",
            ];
            const matching = releases.filter(
              ({ tag_name }) => tag_name === process.env.STABLE_TAG,
            );
            if (matching.length > 1) {
              fail("multiple v2.3.4 Releases exist");
            }
            let releaseId = null;
            let releaseDraft = true;
            const missingAssets = [];
            const replaceAssets = [];
            if (matching.length === 0) {
              missingAssets.push(...expectedNames);
            } else {
              const release = matching[0];
              releaseId = release.id;
              releaseDraft = release.draft;
              if (
                release.name !== process.env.STABLE_TAG
                || release.target_commitish
                  !== process.env.ORIGINAL_SOURCE_REVISION
                || release.body !== expectedBody
                || release.prerelease
                || (!release.draft && release.immutable !== true)
              ) {
                fail("existing v2.3.4 Release identity differs");
              }
              const actualNames = (release.assets ?? [])
                .map(({ name }) => name)
                .sort();
              if (
                new Set(actualNames).size !== actualNames.length
                || actualNames.some((name) => !expectedNames.includes(name))
              ) {
                fail("existing v2.3.4 Release has unexpected assets");
              }
              for (const name of expectedNames) {
                const matches = (release.assets ?? []).filter(
                  (asset) => asset.name === name,
                );
                if (matches.length === 0) {
                  missingAssets.push(name);
                  continue;
                }
                if (
                  matches.length !== 1
                  || !Number.isSafeInteger(matches[0].id)
                  || matches[0].id <= 0
                  || matches[0].state !== "uploaded"
                ) {
                  fail(`v2.3.4 Release asset ${name} is invalid`);
                }
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: matches[0].id,
                    headers: {
                      accept: "application/octet-stream",
                      "X-GitHub-Api-Version": "2026-03-10",
                    },
                  },
                );
                const bytes = response.data instanceof ArrayBuffer
                  ? Buffer.from(response.data)
                  : ArrayBuffer.isView(response.data)
                    ? Buffer.from(
                      response.data.buffer,
                      response.data.byteOffset,
                      response.data.byteLength,
                    )
                    : typeof response.data === "string"
                      ? Buffer.from(response.data, "utf8")
                      : null;
                if (
                  !bytes
                  || createHash("sha256").update(bytes).digest("hex")
                    !== manifest.assets[name]?.sha256
                ) {
                  replaceAssets.push(name);
                }
              }
              if (
                release.immutable === true
                && (missingAssets.length > 0 || replaceAssets.length > 0)
              ) {
                fail("immutable v2.3.4 Release assets differ");
              }
            }
            writeFileSync(
              "stable-predecessor-control-authorization.json",
              `${JSON.stringify({
                schemaVersion:
                  "genio-stable-predecessor-control-authorization/v1",
                repository: process.env.GITHUB_REPOSITORY,
                workflowSha: process.env.GITHUB_SHA,
                stableTag: process.env.STABLE_TAG,
                originalTagObject: process.env.ORIGINAL_TAG_OBJECT,
                originalSourceRevision: process.env.ORIGINAL_SOURCE_REVISION,
                mutationManifestSha256:
                  process.env.MUTATION_MANIFEST_SHA256,
                controlAuditorAppId,
                stableWriterAppId,
                stableTagRulesetId: rulesetId,
                releaseExists: matching.length === 1,
                releaseId,
                releaseDraft,
                missingAssets,
                replaceAssets,
                authorizedAt: new Date().toISOString(),
              }, null, 2)}\n`,
              { flag: "wx", mode: 0o600 },
            );
      - id: receipt
        name: Seal the final bootstrap control authorization
        run: |
          node -e 'const crypto=require("node:crypto"); const fs=require("node:fs"); const bytes=fs.readFileSync("stable-predecessor-control-authorization.json"); if(bytes.length<=0||bytes.length>64*1024) throw new Error("bootstrap control authorization is empty or oversized"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`sha256=${crypto.createHash("sha256").update(bytes).digest("hex")}\n`);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-predecessor-control
          path: stable-predecessor-control-authorization.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    needs: [verify_and_seal, final_reauthorize]
    environment: stable-predecessor-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
      MUTATION_MANIFEST_SHA256: ${{ needs.verify_and_seal.outputs.mutation_manifest_sha256 }}
      CONTROL_RECEIPT_SHA256: ${{ needs.final_reauthorize.outputs.control_receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-predecessor-mutation
          path: stable-predecessor-mutation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-predecessor-control
          path: stable-predecessor-control
      - name: Verify the sealed bootstrap mutation authorization
        env:
          STABLE_RELEASE_WRITER_APP_ID: ${{ vars.STABLE_RELEASE_WRITER_APP_ID }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, readdirSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const sha = (bytes) =>
            createHash("sha256").update(bytes).digest("hex");
          const mutationRoot = "stable-predecessor-mutation";
          const manifestBytes = readFileSync(
            join(mutationRoot, "stable-predecessor-mutation-manifest.json"),
          );
          const receiptFiles = readdirSync("stable-predecessor-control");
          if (
            receiptFiles.length !== 1
            || receiptFiles[0]
              !== "stable-predecessor-control-authorization.json"
            || sha(manifestBytes) !== process.env.MUTATION_MANIFEST_SHA256
          ) {
            throw new Error("sealed bootstrap mutation inventory changed");
          }
          const receiptBytes = readFileSync(
            "stable-predecessor-control/stable-predecessor-control-authorization.json",
          );
          if (sha(receiptBytes) !== process.env.CONTROL_RECEIPT_SHA256) {
            throw new Error("sealed bootstrap authorization changed");
          }
          const manifest = JSON.parse(manifestBytes);
          const receipt = JSON.parse(receiptBytes);
          const authorizedAt = Date.parse(receipt.authorizedAt);
          const now = Date.now();
          const expectedNames = [
            "finalization-evidence.json",
            "protected-semantic-baseline.json",
            "stable-authorization.json",
            "stable-image-attestation.json",
            "stable-release-consumer.json",
          ];
          if (
            receipt.schemaVersion
              !== "genio-stable-predecessor-control-authorization/v1"
            || receipt.repository !== process.env.GITHUB_REPOSITORY
            || receipt.workflowSha !== process.env.GITHUB_SHA
            || receipt.stableTag !== process.env.STABLE_TAG
            || receipt.originalTagObject !== process.env.ORIGINAL_TAG_OBJECT
            || receipt.originalSourceRevision
              !== process.env.ORIGINAL_SOURCE_REVISION
            || receipt.mutationManifestSha256
              !== process.env.MUTATION_MANIFEST_SHA256
            || manifest.stableWriterAppId !== receipt.stableWriterAppId
            || String(receipt.stableWriterAppId)
              !== process.env.STABLE_RELEASE_WRITER_APP_ID
            || typeof receipt.releaseExists !== "boolean"
            || typeof receipt.releaseDraft !== "boolean"
            || !Array.isArray(receipt.missingAssets)
            || !Array.isArray(receipt.replaceAssets)
            || [...receipt.missingAssets, ...receipt.replaceAssets].some(
              (name) => !expectedNames.includes(name),
            )
            || new Set([
              ...receipt.missingAssets,
              ...receipt.replaceAssets,
            ]).size
              !== receipt.missingAssets.length + receipt.replaceAssets.length
            || !Number.isFinite(authorizedAt)
            || authorizedAt > now + 30_000
            || now - authorizedAt > 5 * 60 * 1000
          ) {
            throw new Error("bootstrap authorization is stale or invalid");
          }
          for (const [name, expected] of Object.entries(manifest.assets)) {
            const bytes = readFileSync(join(mutationRoot, name));
            if (
              bytes.length !== expected.size
              || sha(bytes) !== expected.sha256
            ) {
              throw new Error(`bootstrap input ${name} changed after authorization`);
            }
          }
          writeFileSync(
            "stable-predecessor-missing-assets.txt",
            `${receipt.missingAssets.join("\n")}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            "stable-predecessor-replace-assets.txt",
            `${receipt.replaceAssets.join("\n")}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            "stable-predecessor-mutation-state.env",
            `RELEASE_EXISTS=${receipt.releaseExists ? "true" : "false"}\n`
              + `RELEASE_DRAFT=${receipt.releaseDraft ? "true" : "false"}\n`,
            { mode: 0o600 },
          );
          NODE
      - name: Reject a stale controller or historical tag before writer minting
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: process.env.DEFAULT_BRANCH,
            });
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.STABLE_TAG}`,
            });
            if (
              !branch.data.protected
              || branch.data.commit.sha !== context.sha
              || process.env.GITHUB_WORKFLOW_SHA !== context.sha
              || ref.data.object.type !== "tag"
              || ref.data.object.sha !== process.env.ORIGINAL_TAG_OBJECT
            ) {
              throw new Error("bootstrap controller or annotated tag changed");
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: process.env.ORIGINAL_TAG_OBJECT,
            });
            if (
              tag.data.tag !== process.env.STABLE_TAG
              || tag.data.object.type !== "commit"
              || tag.data.object.sha !== process.env.ORIGINAL_SOURCE_REVISION
              || tag.data.message !== "Release v2.3.4\n"
            ) {
              throw new Error("bootstrap annotated tag target changed");
            }
      - id: stable_writer
        name: Mint the repository-scoped stable writer only for mutation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.STABLE_RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.STABLE_RELEASE_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create or reconcile only the exact v2.3.4 Release
        run: |
          source stable-predecessor-mutation-state.env
          if test "$RELEASE_EXISTS" = "false"; then
            GH_TOKEN="${{ steps.stable_writer.outputs.token }}" \
              gh release create "$STABLE_TAG" \
              --draft \
              --verify-tag \
              --target "$ORIGINAL_SOURCE_REVISION" \
              --title "$STABLE_TAG" \
              --notes-file stable-predecessor-mutation/stable-predecessor-release-notes.txt
          fi
          while IFS= read -r ASSET; do
            test -n "$ASSET" || continue
            GH_TOKEN="${{ steps.stable_writer.outputs.token }}" \
              gh release delete-asset "$STABLE_TAG" "$ASSET" --yes
            GH_TOKEN="${{ steps.stable_writer.outputs.token }}" \
              gh release upload "$STABLE_TAG" \
              "stable-predecessor-mutation/$ASSET"
          done < stable-predecessor-replace-assets.txt
          while IFS= read -r ASSET; do
            test -n "$ASSET" || continue
            GH_TOKEN="${{ steps.stable_writer.outputs.token }}" \
              gh release upload "$STABLE_TAG" \
              "stable-predecessor-mutation/$ASSET"
          done < stable-predecessor-missing-assets.txt
          if test "$RELEASE_DRAFT" = "true"; then
            GH_TOKEN="${{ steps.stable_writer.outputs.token }}" \
              gh release edit "$STABLE_TAG" --draft=false
          fi
      - name: Verify the exact published immutable v2.3.4 Release read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" \
            > published-stable-release-api.json
          mkdir exact-release-assets
          gh release download "$STABLE_TAG" \
            --dir exact-release-assets \
            --pattern finalization-evidence.json \
            --pattern protected-semantic-baseline.json \
            --pattern stable-authorization.json \
            --pattern stable-image-attestation.json \
            --pattern stable-release-consumer.json
          cmp stable-predecessor-mutation/finalization-evidence.json exact-release-assets/finalization-evidence.json
          cmp stable-predecessor-mutation/protected-semantic-baseline.json exact-release-assets/protected-semantic-baseline.json
          cmp stable-predecessor-mutation/stable-authorization.json exact-release-assets/stable-authorization.json
          cmp stable-predecessor-mutation/stable-image-attestation.json exact-release-assets/stable-image-attestation.json
          cmp stable-predecessor-mutation/stable-release-consumer.json exact-release-assets/stable-release-consumer.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const release = JSON.parse(
            readFileSync("published-stable-release-api.json", "utf8"),
          );
          const expectedAssets = [
            "finalization-evidence.json",
            "protected-semantic-baseline.json",
            "stable-authorization.json",
            "stable-image-attestation.json",
            "stable-release-consumer.json",
          ];
          const actualAssets = (release.assets ?? [])
            .map(({ name }) => name)
            .sort();
          if (
            release.tag_name !== process.env.STABLE_TAG
            || release.target_commitish !== process.env.ORIGINAL_SOURCE_REVISION
            || release.name !== process.env.STABLE_TAG
            || release.body !== readFileSync(
              "stable-predecessor-mutation/stable-predecessor-release-notes.txt",
              "utf8",
            )
            || release.draft
            || release.prerelease
            || release.immutable !== true
            || JSON.stringify(actualAssets) !== JSON.stringify(expectedAssets)
          ) {
            throw new Error("v2.3.4 Release is not exact, published, and immutable");
          }
          NODE
