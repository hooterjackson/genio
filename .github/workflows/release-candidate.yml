name: release candidate

on:
  # repository_dispatch workflows are always loaded from the protected default
  # branch. This prevents an RC tag from supplying the workflow that evaluates
  # and publishes itself.
  repository_dispatch:
    types: [genio-release-candidate]

concurrency:
  group: stable-release-mutation
  cancel-in-progress: false

# Every job declares its own least-privilege token. In particular, the runner
# that installs Playwright and executes candidate code has no package, OIDC, or
# attestation write authority.
permissions: {}

jobs:
  control:
    environment: release-control-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_TAG: ${{ github.event.client_payload.candidate_tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RC_TAG_RULESET_ID: "19863848"
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_tag_object: ${{ steps.candidate.outputs.tag_object }}
      candidate_tag_target: ${{ steps.candidate.outputs.tag_target }}
      controller_revision: ${{ steps.candidate.outputs.controller_revision }}
    steps:
      - id: control_auditor
        name: Mint the repository-scoped release control auditor token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_AUDITOR_APP_PRIVATE_KEY }}
          permission-actions: read
          # GitHub omits ruleset bypass_actors from read-only callers. This App
          # has no mutation credential; Administration write exists only so the
          # immutable ruleset can be inspected exactly.
          permission-administration: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Fence the controller and exact annotated candidate tag
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml@refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          node -e 'const value=JSON.parse(process.env.CLIENT_PAYLOAD_JSON??"null"); if(!value||typeof value!=="object"||Array.isArray(value)||Object.keys(value).sort().join(",")!=="candidate_tag") throw new Error("release dispatch accepts exactly one client_payload key: candidate_tag");'
          case "$CANDIDATE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*-rc.[1-9]*) ;;
            *) echo "candidate tag is invalid" >&2; exit 1 ;;
          esac
          git fetch --force origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "+refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
          CONTROLLER_REVISION="$(git rev-parse HEAD)"
          TAG_OBJECT="$(git rev-parse "refs/tags/$CANDIDATE_TAG")"
          test "$(git cat-file -t "$TAG_OBJECT")" = "tag"
          TAG_TARGET="$(git rev-parse "$TAG_OBJECT^{}")"
          test "$CONTROLLER_REVISION" = "$GITHUB_SHA"
          test "$CONTROLLER_REVISION" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"
          test "$TAG_TARGET" = "$CONTROLLER_REVISION"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"
          echo "tag_target=$TAG_TARGET" >> "$GITHUB_OUTPUT"
          echo "controller_revision=$CONTROLLER_REVISION" >> "$GITHUB_OUTPUT"
      - name: Verify exact repository, review, CI, environment, and tag controls
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.tag_target }}
          CONTROL_AUDITOR_APP_ID: ${{ vars.RELEASE_CONTROL_AUDITOR_APP_ID }}
        with:
          github-token: ${{ steps.control_auditor.outputs.token }}
          script: |
            const fail = (message) => {
              throw new Error(`release control audit: ${message}`);
            };
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const defaultBranch = context.payload.repository?.default_branch;
            const requiredChecks = [
              "static",
              "policy",
              "unit-and-database",
              "production-database-compatibility",
              "browser (mobile-320)",
              "browser (mobile-390)",
              "browser (mobile-430)",
              "browser (desktop)",
            ];
            if (
              context.payload.repository?.fork !== false
              || context.ref !== `refs/heads/${defaultBranch}`
              || context.sha !== process.env.CANDIDATE_SHA
            ) {
              fail("controller is forked, stale, or not the default-branch head");
            }
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!["admin", "maintain"].includes(permission.data.permission)) {
              fail("release dispatch requires maintain or admin permission");
            }
            const [branch, protection, githubActionsApp] = await Promise.all([
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: defaultBranch,
              }),
              github.rest.repos.getBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: defaultBranch,
              }),
              github.rest.apps.getBySlug({ app_slug: "github-actions" }),
            ]);
            const githubActionsAppId = Number(githubActionsApp.data.id);
            const controlAuditorAppId = Number(
              process.env.CONTROL_AUDITOR_APP_ID,
            );
            if (
              branch.data.protected !== true
              || branch.data.commit.sha !== process.env.CANDIDATE_SHA
              || githubActionsApp.data.slug !== "github-actions"
              || !Number.isSafeInteger(githubActionsAppId)
              || githubActionsAppId <= 0
              || !Number.isSafeInteger(controlAuditorAppId)
              || controlAuditorAppId <= 0
              || controlAuditorAppId === githubActionsAppId
            ) {
              fail("branch or release-control Integration identity is invalid");
            }
            const configuredChecks =
              protection.data.required_status_checks?.checks ?? [];
            const configuredCheckNames = configuredChecks
              .map(({ context: name }) => name)
              .sort();
            if (
              protection.data.required_status_checks?.strict !== true
              || configuredChecks.length !== requiredChecks.length
              || JSON.stringify(configuredCheckNames)
                !== JSON.stringify([...requiredChecks].sort())
              || configuredChecks.some(({ app_id: appId }) =>
                Number(appId) !== githubActionsAppId
              )
              || protection.data.required_pull_request_reviews
                ?.required_approving_review_count !== 0
              || protection.data.required_pull_request_reviews
                ?.dismiss_stale_reviews !== true
              || protection.data.required_pull_request_reviews
                ?.require_code_owner_reviews !== false
              || protection.data.required_pull_request_reviews
                ?.require_last_push_approval !== false
              || protection.data.enforce_admins?.enabled !== true
              || protection.data.required_conversation_resolution?.enabled
                !== true
              || protection.data.allow_force_pushes?.enabled !== false
              || protection.data.allow_deletions?.enabled !== false
            ) {
              fail("default-branch protection differs from the exact release policy");
            }
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: process.env.CANDIDATE_SHA,
                per_page: 100,
              },
            );
            const mergedPulls = pulls.filter((pull) =>
              pull.merged_at
              && pull.base.ref === defaultBranch
              && pull.merge_commit_sha === process.env.CANDIDATE_SHA
            );
            if (mergedPulls.length !== 1) {
              fail("candidate must be exactly one merged default-branch PR");
            }
            const trustedWorkflowPath = ".github/workflows/ci.yml";
            const trustedWorkflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: trustedWorkflowPath,
            });
            if (
              trustedWorkflow.data.path !== trustedWorkflowPath
              || trustedWorkflow.data.state !== "active"
            ) {
              fail("trusted CI workflow is not active on the default branch");
            }
            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: trustedWorkflow.data.id,
                branch: defaultBranch,
                event: "push",
                status: "completed",
                head_sha: process.env.CANDIDATE_SHA,
                per_page: 100,
              },
            );
            const trustedRuns = workflowRuns.filter((run) =>
              run.workflow_id === trustedWorkflow.data.id
              && run.path === trustedWorkflowPath
              && run.event === "push"
              && run.head_branch === defaultBranch
              && run.head_sha === process.env.CANDIDATE_SHA
              && run.repository?.full_name === repository
              && run.head_repository?.full_name === repository
              && run.conclusion === "success"
            ).sort((left, right) =>
              Number(right.run_attempt ?? 0) - Number(left.run_attempt ?? 0)
            );
            const trustedRun = trustedRuns[0];
            if (!trustedRun?.check_suite_id) {
              fail("candidate has no successful trusted default-branch CI run");
            }
            const checkRuns = await github.paginate(
              github.rest.checks.listForSuite,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_suite_id: trustedRun.check_suite_id,
                filter: "latest",
                per_page: 100,
              },
            );
            const latestChecks = new Map();
            for (const check of checkRuns) {
              if (
                check.head_sha !== process.env.CANDIDATE_SHA
                || check.app?.id !== githubActionsAppId
                || check.app?.slug !== "github-actions"
                || check.check_suite?.id !== trustedRun.check_suite_id
              ) {
                fail("candidate check provenance is not the trusted App-bound suite");
              }
              const prior = latestChecks.get(check.name);
              if (!prior || Date.parse(check.completed_at ?? check.started_at ?? "0")
                > Date.parse(prior.completed_at ?? prior.started_at ?? "0")) {
                latestChecks.set(check.name, check);
              }
            }
            if (
              latestChecks.size !== requiredChecks.length
              || requiredChecks.some((name) =>
                latestChecks.get(name)?.conclusion !== "success"
              )
            ) {
              fail("candidate does not have the exact successful App-bound checks");
            }
            for (const environmentName of [
              "release-control-audit",
              "release-candidate",
            ]) {
              const environment = await github.request(
                "GET /repos/{owner}/{repo}/environments/{environment_name}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment_name: environmentName,
                },
              );
              const reviewerRule = (environment.data.protection_rules ?? [])
                .find((rule) => rule.type === "required_reviewers");
              if (
                environment.data.name !== environmentName
                || environment.data.can_admins_bypass !== false
                || environment.data.deployment_branch_policy?.protected_branches
                  !== true
                || environment.data.deployment_branch_policy
                  ?.custom_branch_policies !== false
                || !reviewerRule
                || !Array.isArray(reviewerRule.reviewers)
                || reviewerRule.reviewers.length !== 1
                || reviewerRule.reviewers[0]?.type !== "User"
                || reviewerRule.reviewers[0]?.reviewer?.login?.toLowerCase()
                  !== context.repo.owner.toLowerCase()
                || environment.data.prevent_self_review === true
                || reviewerRule.prevent_self_review === true
              ) {
                fail(`${environmentName} lacks exact solo-owner manual approval`);
              }
            }
            const immutableReleases = await github.request(
              "GET /repos/{owner}/{repo}/immutable-releases",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              },
            );
            if (immutableReleases.data.enabled !== true) {
              fail("repository immutable Releases are not enabled");
            }
            const rulesetId = Number(process.env.RC_TAG_RULESET_ID);
            const ruleset = await github.request(
              "GET /repos/{owner}/{repo}/rulesets/{ruleset_id}",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ruleset_id: rulesetId,
              },
            );
            const ruleTypes = (ruleset.data.rules ?? [])
              .map(({ type }) => type)
              .sort();
            if (
              rulesetId !== 19863848
              || ruleset.data.target !== "tag"
              || ruleset.data.enforcement !== "active"
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.include ?? [])].sort(),
              ) !== JSON.stringify(["refs/tags/v*-rc.*"])
              || JSON.stringify(
                [...(ruleset.data.conditions?.ref_name?.exclude ?? [])].sort(),
              ) !== JSON.stringify([])
              || JSON.stringify(ruleTypes)
                !== JSON.stringify(["deletion", "update"])
              || (ruleset.data.bypass_actors ?? []).length !== 0
            ) {
              fail("immutable RC tag ruleset 19863848 differs from policy");
            }

  authorize:
    needs: [control]
    environment: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
      packages: read
    env:
      CANDIDATE_TAG: ${{ needs.control.outputs.candidate_tag }}
      EXPECTED_CANDIDATE_TAG_OBJECT: ${{ needs.control.outputs.candidate_tag_object }}
      EXPECTED_CANDIDATE_TAG_TARGET: ${{ needs.control.outputs.candidate_tag_target }}
      EXPECTED_CONTROLLER_REVISION: ${{ needs.control.outputs.controller_revision }}
    outputs:
      candidate_tag: ${{ steps.identity.outputs.candidate_tag }}
      candidate_tag_object: ${{ steps.identity.outputs.candidate_tag_object }}
      candidate_tag_target: ${{ steps.identity.outputs.candidate_tag_target }}
      controller_revision: ${{ steps.identity.outputs.controller_revision }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
      version: ${{ steps.identity.outputs.version }}
      image: ${{ steps.identity.outputs.image }}
      release_verification_key_sha256: ${{ steps.release_authority.outputs.sha256 }}
      public_rollout_intent_canary_authority_policy_sha256: ${{ steps.release_authority.outputs.public_rollout_intent_canary_authority_policy_sha256 }}
      semantic_baseline_metadata_sha256: ${{ steps.stable_predecessor.outputs.metadata_sha256 }}
      semantic_baseline_stable_tag: ${{ steps.stable_predecessor.outputs.stable_tag }}
      semantic_baseline_release_key_sha256: ${{ steps.stable_predecessor.outputs.release_key_sha256 }}
      semantic_baseline_stable_authorizer_key_id: ${{ steps.stable_predecessor.outputs.stable_authorizer_key_id }}
      semantic_baseline_stable_authorizer_key_sha256: ${{ steps.stable_predecessor.outputs.stable_authorizer_key_sha256 }}
      semantic_baseline_release_id: ${{ steps.stable_predecessor.outputs.release_id }}
      semantic_baseline_release_identity_sha256: ${{ steps.stable_predecessor.outputs.release_identity_sha256 }}
      semantic_baseline_asset_sha256_json_b64url: ${{ steps.stable_predecessor.outputs.asset_sha256_json_b64url }}
      semantic_baseline_predecessor_mode: ${{ steps.stable_predecessor.outputs.predecessor_mode }}
      semantic_baseline_controller_source_revision: ${{ steps.stable_predecessor.outputs.controller_source_revision }}
      semantic_baseline_github_attestation_verification_bytes_sha256: ${{ steps.semantic_baseline_handoff.outputs.github_attestation_verification_bytes_sha256 }}
      semantic_baseline_handoff_sha256: ${{ steps.semantic_baseline_handoff.outputs.sha256 }}
      stable_authorizer_key_id: ${{ steps.release_authority.outputs.stable_authorizer_key_id }}
      stable_authorizer_key_sha256: ${{ steps.release_authority.outputs.stable_authorizer_key_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: release_authority
        name: Pin the release verification authority
        env:
          RELEASE_VERIFICATION_KEY_SHA256: ${{ vars.RELEASE_VERIFICATION_KEY_SHA256 }}
          RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256: ${{ vars.RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 }}
          RELEASE_STABLE_AUTHORIZER_KEY_ID: ${{ vars.RELEASE_STABLE_AUTHORIZER_KEY_ID }}
          RELEASE_STABLE_AUTHORIZER_KEY_SHA256: ${{ vars.RELEASE_STABLE_AUTHORIZER_KEY_SHA256 }}
        run: |
          if [[ "$RELEASE_VERIFICATION_KEY_SHA256" == "<64-hex>" || "$RELEASE_VERIFICATION_KEY_SHA256" == "<real_64_hex>" || "$RELEASE_VERIFICATION_KEY_SHA256" =~ ^0{64}$ ]]; then
            echo "RELEASE_VERIFICATION_KEY_SHA256 is still a placeholder." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERIFICATION_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "RELEASE_VERIFICATION_KEY_SHA256 must be a configured lowercase SHA-256 digest." >&2
            exit 1
          fi
          if [[ "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" == "<64-hex>" || "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" == "<real_64_hex>" || "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" =~ ^0{64}$ ]]; then
            echo "RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 is still a placeholder." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 must pin the protected source/producer authority set and fixture registry." >&2
            exit 1
          fi
          if [[ "$RELEASE_STABLE_AUTHORIZER_KEY_ID" == "<key-id>" || "$RELEASE_STABLE_AUTHORIZER_KEY_ID" == "<real_key_id>" ]]; then
            echo "RELEASE_STABLE_AUTHORIZER_KEY_ID is still a placeholder." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_STABLE_AUTHORIZER_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:+/-]{2,159}$ ]]; then
            echo "RELEASE_STABLE_AUTHORIZER_KEY_ID must pin the protected stable authorizer." >&2
            exit 1
          fi
          if [[ "$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" == "<64-hex>" || "$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" == "<real_64_hex>" || "$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" =~ ^0{64}$ ]]; then
            echo "RELEASE_STABLE_AUTHORIZER_KEY_SHA256 is still a placeholder." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" =~ ^[0-9a-f]{64}$ || "$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" = "$RELEASE_VERIFICATION_KEY_SHA256" ]]; then
            echo "RELEASE_STABLE_AUTHORIZER_KEY_SHA256 must pin a distinct protected stable-authorizer key." >&2
            exit 1
          fi
          echo "sha256=$RELEASE_VERIFICATION_KEY_SHA256" >> "$GITHUB_OUTPUT"
          echo "public_rollout_intent_canary_authority_policy_sha256=$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" >> "$GITHUB_OUTPUT"
          echo "stable_authorizer_key_id=$RELEASE_STABLE_AUTHORIZER_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "stable_authorizer_key_sha256=$RELEASE_STABLE_AUTHORIZER_KEY_SHA256" >> "$GITHUB_OUTPUT"
      - id: candidate
        name: Reverify the authorized controller and annotated candidate tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --force origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "+refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
          CANDIDATE_TAG_OBJECT="$(git rev-parse "refs/tags/$CANDIDATE_TAG")"
          test "$(git cat-file -t "$CANDIDATE_TAG_OBJECT")" = "tag"
          CANDIDATE_SHA="$(git rev-parse "$CANDIDATE_TAG_OBJECT^{}")"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER_REVISION"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$EXPECTED_CONTROLLER_REVISION"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROLLER_REVISION"
          test "$CANDIDATE_TAG_OBJECT" = "$EXPECTED_CANDIDATE_TAG_OBJECT"
          test "$CANDIDATE_SHA" = "$EXPECTED_CANDIDATE_TAG_TARGET"
          test "$CANDIDATE_SHA" = "$EXPECTED_CONTROLLER_REVISION"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_object=$CANDIDATE_TAG_OBJECT" >> "$GITHUB_OUTPUT"
          echo "tag_target=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "controller_revision=$EXPECTED_CONTROLLER_REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Verify annotated RC identity
        run: |
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG")" = "$EXPECTED_CANDIDATE_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG^{}")" = "$EXPECTED_CANDIDATE_TAG_TARGET"
          node scripts/check-release.mjs --require-exact-tag "$CANDIDATE_TAG"
      - id: identity
        name: Resolve candidate identity
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_tag_object=${{ steps.candidate.outputs.tag_object }}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag_target=${{ steps.candidate.outputs.tag_target }}" >> "$GITHUB_OUTPUT"
          echo "controller_revision=${{ steps.candidate.outputs.controller_revision }}" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY_OWNER,,}/genio" >> "$GITHUB_OUTPUT"
      - id: stable_predecessor
        name: Resolve the exact immutable stable predecessor and signed lineage
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        with:
          script: |
            const { createHash } = require("node:crypto");
            const { mkdir, writeFile } = require("node:fs/promises");
            const { join } = require("node:path");

            const SHA256 = /^[0-9a-f]{64}$/u;
            const SOURCE_REVISION = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/u;
            const IMAGE_DIGEST = /^sha256:[0-9a-f]{64}$/u;
            const SIGNING_KEY_ID =
              /^[0-9A-Za-z][0-9A-Za-z._:+/-]{0,159}$/u;
            const STABLE_AUTHORIZER_KEY_ID =
              /^[0-9A-Za-z][0-9A-Za-z._:+/-]{2,159}$/u;
            const SIGNATURE = /^[0-9A-Za-z_-]{64,256}$/u;
            const STABLE_TAG = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const RC_TAG =
              /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))-rc\.[1-9]\d*$/u;
            const BOOTSTRAP_SUCCESSOR_RC = /^v2\.4\.0-rc\.[1-9]\d*$/u;
            const BOOTSTRAP_STABLE_TAG = "v2.3.4";
            const BOOTSTRAP_COMPATIBILITY_RC_TAG = "v2.3.4-rc.1";
            const BOOTSTRAP_SOURCE_REVISION =
              "7dc877cfc1537a9936974f9699a4b8ba9740b5f5";
            const BOOTSTRAP_TAG_OBJECT =
              "0fb63ccc88b6f5ea675b3b43506fc112fa3fae58";
            const BOOTSTRAP_SOURCE_TREE =
              "91076c2f06de9d562532981c3a602f1c6366f057";
            const BOOTSTRAP_CONTROLLER_WORKFLOW =
              ".github/workflows/bootstrap-stable-predecessor.yml";
            const BOOTSTRAP_IMAGE_WORKFLOW =
              ".github/workflows/bootstrap-stable-predecessor-image.yml";
            const expectedAssetNames = [
              "finalization-evidence.json",
              "protected-semantic-baseline.json",
              "stable-authorization.json",
              "stable-image-attestation.json",
              "stable-release-consumer.json",
            ];

            function fail(message) {
              throw new Error(`immutable stable predecessor: ${message}`);
            }
            function record(value, label) {
              if (!value || typeof value !== "object" || Array.isArray(value)) {
                fail(`${label} must be an object`);
              }
              return value;
            }
            function exact(value, keys, label) {
              const source = record(value, label);
              const actual = Object.keys(source).sort();
              const expected = [...keys].sort();
              if (
                actual.length !== expected.length
                || actual.some((key, index) => key !== expected[index])
              ) {
                fail(`${label} contains missing or unapproved fields`);
              }
              return source;
            }
            function sortedJsonValue(value) {
              if (Array.isArray(value)) return value.map(sortedJsonValue);
              if (!value || typeof value !== "object") return value;
              return Object.fromEntries(
                Object.entries(value)
                  .sort(([left], [right]) => left.localeCompare(right))
                  .map(([key, item]) => [key, sortedJsonValue(item)]),
              );
            }
            function stableJson(value) {
              return JSON.stringify(sortedJsonValue(value));
            }
            function sha256(value) {
              return createHash("sha256").update(value).digest("hex");
            }
            function stableSha256(value) {
              return sha256(Buffer.from(stableJson(value), "utf8"));
            }
            function digest(value, label) {
              if (typeof value !== "string" || !SHA256.test(value)) {
                fail(`${label} must be a lowercase SHA-256 digest`);
              }
              return value;
            }
            function timestamp(value, label) {
              const parsed = typeof value === "string" ? Date.parse(value) : NaN;
              if (
                !Number.isFinite(parsed)
                || new Date(parsed).toISOString() !== value
              ) {
                fail(`${label} must be a canonical ISO timestamp`);
              }
              return parsed;
            }
            function versionTuple(tag) {
              const match = STABLE_TAG.exec(tag);
              return match
                ? [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])]
                : null;
            }
            function compareVersion(left, right) {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            }
            function responseBytes(data, label) {
              if (data instanceof ArrayBuffer) return Buffer.from(data);
              if (ArrayBuffer.isView(data)) {
                return Buffer.from(data.buffer, data.byteOffset, data.byteLength);
              }
              if (typeof data === "string") return Buffer.from(data, "utf8");
              fail(`${label} did not return raw asset bytes`);
            }
            function parseJson(bytes, label) {
              let value;
              try {
                value = JSON.parse(bytes.toString("utf8"));
              } catch {
                fail(`${label} is not valid JSON`);
              }
              return value;
            }
            function validateEnvelope(value, schemaVersion, label) {
              const envelope = exact(
                value,
                ["schemaVersion", "payload", "payloadHash", "signature"],
                label,
              );
              if (envelope.schemaVersion !== schemaVersion) {
                fail(`${label} uses an unsupported schema`);
              }
              const payload = record(envelope.payload, `${label}.payload`);
              const payloadHash = digest(
                envelope.payloadHash,
                `${label}.payloadHash`,
              );
              if (payloadHash !== stableSha256(payload)) {
                fail(`${label} payload hash does not match its canonical payload`);
              }
              const signature = exact(
                envelope.signature,
                ["algorithm", "keyId", "value"],
                `${label}.signature`,
              );
              if (
                signature.algorithm !== "Ed25519"
                || typeof signature.keyId !== "string"
                || !SIGNING_KEY_ID.test(signature.keyId)
                || typeof signature.value !== "string"
                || !SIGNATURE.test(signature.value)
              ) {
                fail(`${label} signature envelope is invalid`);
              }
              return { envelope, payload, payloadHash, signature };
            }

            const candidateMatch = RC_TAG.exec(process.env.CANDIDATE_TAG ?? "");
            if (!candidateMatch) fail("candidate tag is not a strict RC tag");
            const candidateVersion = versionTuple(`v${candidateMatch[1]}`);
            if (!candidateVersion) fail("candidate version is invalid");
            if (!SOURCE_REVISION.test(process.env.CANDIDATE_SHA ?? "")) {
              fail("candidate source revision is invalid");
            }

            const [releases, stableTagRefs] = await Promise.all([
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
              github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              }),
            ]);
            const stableTagAtOrAboveCandidate = stableTagRefs.some((ref) => {
              const tuple = versionTuple(ref.ref?.replace(/^refs\/tags\//u, "") ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            const stableReleaseAtOrAboveCandidate = releases.some((release) => {
              const tuple = versionTuple(release.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            if (
              stableTagAtOrAboveCandidate
              || stableReleaseAtOrAboveCandidate
            ) {
              fail(
                "candidate version must be greater than every existing stable tag and release",
              );
            }
            const lowerStableVersions = releases.flatMap((release) => {
              const tuple = versionTuple(release.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) < 0
                ? [{ release, tuple }]
                : [];
            });
            lowerStableVersions.sort(
              (left, right) => compareVersion(right.tuple, left.tuple),
            );
            const selected = lowerStableVersions[0]?.release;
            if (!selected) {
              fail("candidate has no lower stable semantic-version release");
            }
            if (
              selected.draft !== false
              || selected.prerelease !== false
              || selected.immutable !== true
              || typeof selected.published_at !== "string"
              || !Number.isSafeInteger(selected.id)
              || selected.id <= 0
              || selected.tag_name !== selected.name
            ) {
              fail(
                "greatest lower stable semantic-version release is not published and immutable",
              );
            }

            const assetNames = (selected.assets ?? [])
              .map((asset) => asset?.name)
              .sort();
            if (
              JSON.stringify(assetNames)
                !== JSON.stringify(expectedAssetNames)
            ) {
              fail("published release does not have the exact signed-lineage asset inventory");
            }
            const assetsByName = new Map();
            for (const asset of selected.assets ?? []) {
              if (
                !Number.isSafeInteger(asset.id)
                || asset.id <= 0
                || asset.state !== "uploaded"
                || !Number.isSafeInteger(asset.size)
                || asset.size <= 0
                || assetsByName.has(asset.name)
              ) {
                fail(`release asset ${asset?.name ?? "<unknown>"} is invalid`);
              }
              assetsByName.set(asset.name, asset);
            }

            const assetBytes = new Map();
            const assetSha256 = {};
            const handoffDirectory = "semantic-baseline-handoff";
            await mkdir(handoffDirectory, { mode: 0o700 });
            for (const name of expectedAssetNames) {
              const asset = assetsByName.get(name);
              const response = await github.request(
                "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                  headers: {
                    accept: "application/octet-stream",
                    "X-GitHub-Api-Version": "2026-03-10",
                  },
                },
              );
              const bytes = responseBytes(response.data, name);
              const observed = sha256(bytes);
              if (
                bytes.length !== asset.size
                || (
                  typeof asset.digest === "string"
                  && asset.digest !== `sha256:${observed}`
                )
              ) {
                fail(`release asset ${name} bytes do not match its API identity`);
              }
              assetBytes.set(name, bytes);
              assetSha256[name] = observed;
              await writeFile(join(handoffDirectory, name), bytes, {
                flag: "wx",
                mode: 0o600,
              });
            }

            const metadata = exact(
              parseJson(
                assetBytes.get("protected-semantic-baseline.json"),
                "protected semantic baseline metadata",
              ),
              [
                "schemaVersion",
                "rcTag",
                "stableTag",
                "version",
                "sourceRevision",
                "imageDigest",
                "imageReference",
                "finalizationEvidencePayloadHash",
                "finalBrowserGateEvidenceHash",
                "fixtures",
              ],
              "protected semantic baseline metadata",
            );
            if (
              metadata.schemaVersion
                !== "genio-semantic-ranking-protected-baseline/v2"
              || metadata.stableTag !== selected.tag_name
              || metadata.version !== selected.tag_name.slice(1)
              || metadata.stableTag !== `v${metadata.version}`
              || !RC_TAG.test(metadata.rcTag)
              || !String(metadata.rcTag).startsWith(`${metadata.stableTag}-rc.`)
              || !SOURCE_REVISION.test(metadata.sourceRevision ?? "")
              || !IMAGE_DIGEST.test(metadata.imageDigest ?? "")
              || metadata.imageReference
                !== `ghcr.io/${context.repo.owner.toLowerCase()}/genio@${metadata.imageDigest}`
              || !Array.isArray(metadata.fixtures)
              || metadata.fixtures.length < 3
            ) {
              fail("protected semantic baseline metadata has an invalid release identity");
            }
            digest(
              metadata.finalizationEvidencePayloadHash,
              "metadata finalization evidence hash",
            );
            digest(
              metadata.finalBrowserGateEvidenceHash,
              "metadata final browser evidence hash",
            );
            const fixtureIds = new Set();
            for (const [index, fixtureValue] of metadata.fixtures.entries()) {
              const fixture = exact(
                fixtureValue,
                ["fixtureId", "orderedManifestHash", "outputHash"],
                `protected semantic baseline fixture ${index}`,
              );
              if (
                typeof fixture.fixtureId !== "string"
                || fixture.fixtureId.length < 3
                || fixtureIds.has(fixture.fixtureId)
              ) {
                fail(`protected semantic baseline fixture ${index} is invalid`);
              }
              fixtureIds.add(fixture.fixtureId);
              digest(fixture.orderedManifestHash, `fixture ${index} manifest hash`);
              digest(fixture.outputHash, `fixture ${index} output hash`);
            }
            const metadataSha256 = stableSha256(metadata);

            const signedEvidenceValue = parseJson(
              assetBytes.get("finalization-evidence.json"),
              "signed predecessor evidence",
            );
            const signedAuthorizationValue = parseJson(
              assetBytes.get("stable-authorization.json"),
              "signed predecessor authorization",
            );
            const evidenceSchema = String(
              record(signedEvidenceValue, "signed predecessor evidence")
                .schemaVersion ?? "",
            );
            const evidencePayloadSchema = String(
              record(
                record(
                  signedEvidenceValue,
                  "signed predecessor evidence",
                ).payload,
                "signed predecessor evidence payload",
              ).schemaVersion ?? "",
            );
            const authorizationSchema = String(
              record(
                signedAuthorizationValue,
                "signed predecessor authorization",
              ).schemaVersion ?? "",
            );
            const authorizationPayloadSchema = String(
              record(
                record(
                  signedAuthorizationValue,
                  "signed predecessor authorization",
                ).payload,
                "signed predecessor authorization payload",
              ).schemaVersion ?? "",
            );
            const normalSchemaPair =
              evidenceSchema === "genio-signed-release-evidence/v3"
              && evidencePayloadSchema === "genio-release-evidence/v3"
              && authorizationSchema
                === "genio-signed-stable-release-authorization/v2"
              && authorizationPayloadSchema
                === "genio-stable-release-authorization/v2";
            const bootstrapSchemaPair =
              evidenceSchema
                === "genio-signed-stable-predecessor-bootstrap-evidence/v2"
              && evidencePayloadSchema
                === "genio-stable-predecessor-bootstrap-evidence/v2"
              && authorizationSchema
                === "genio-signed-stable-predecessor-bootstrap-authorization/v2"
              && authorizationPayloadSchema
                === "genio-stable-predecessor-bootstrap-authorization/v2";
            if (normalSchemaPair === bootstrapSchemaPair) {
              fail(
                "evidence and authorization must use one exact supported schema pair",
              );
            }
            const predecessorMode = bootstrapSchemaPair
              ? "bootstrap"
              : "normal";
            const finalization = validateEnvelope(
              signedEvidenceValue,
              evidenceSchema,
              "signed predecessor evidence",
            );
            const authorization = validateEnvelope(
              signedAuthorizationValue,
              authorizationSchema,
              "signed predecessor authorization",
            );
            let finalizationGeneratedAt;
            let finalizationExpiresAt;
            let authorizationGeneratedAt;
            let authorizationExpiresAt;
            let controllerSourceRevision = null;
            let imageSignerWorkflow = ".github/workflows/release-candidate.yml";
            let imageSignerSourceDigest = metadata.sourceRevision;
            let imageGithubVerificationHash = null;

            if (predecessorMode === "normal") {
              const finalizationPayload = exact(
                finalization.payload,
                [
                  "schemaVersion",
                  "kind",
                  "generatedAt",
                  "expiresAt",
                  "candidate",
                  "lineage",
                  "configuration",
                  "stagingControls",
                  "runtime",
                  "semanticReview",
                  "environmentSnapshots",
                  "gates",
                ],
                "finalization evidence payload",
              );
              const finalizationCandidate = exact(
                finalizationPayload.candidate,
                [
                  "tag",
                  "version",
                  "sourceRevision",
                  "imageDigest",
                  "sitesSourceRevision",
                ],
                "finalization evidence candidate",
              );
              finalizationGeneratedAt = timestamp(
                finalizationPayload.generatedAt,
                "finalization evidence generatedAt",
              );
              finalizationExpiresAt = timestamp(
                finalizationPayload.expiresAt,
                "finalization evidence expiresAt",
              );
              if (
                finalizationPayload.schemaVersion
                  !== "genio-release-evidence/v3"
                || finalizationPayload.kind !== "finalization"
                || finalizationExpiresAt <= finalizationGeneratedAt
                || finalizationExpiresAt - finalizationGeneratedAt
                  > 24 * 60 * 60 * 1000
                || finalizationCandidate.tag !== metadata.rcTag
                || finalizationCandidate.version !== metadata.version
                || finalizationCandidate.sourceRevision
                  !== metadata.sourceRevision
                || finalizationCandidate.sitesSourceRevision
                  !== metadata.sourceRevision
                || finalizationCandidate.imageDigest !== metadata.imageDigest
                || finalization.payloadHash
                  !== metadata.finalizationEvidencePayloadHash
              ) {
                fail(
                  "signed finalization evidence does not bind the exact stable target",
                );
              }
              const stagingControls = record(
                finalizationPayload.stagingControls,
                "finalization staging controls",
              );
              const productionSnapshot = record(
                record(
                  finalizationPayload.environmentSnapshots,
                  "finalization environment snapshots",
                ).production,
                "finalization production snapshot",
              );
              if (
                stagingControls.controlPlanePhase !== "finalization"
                || stagingControls.candidateImageReference
                  !== metadata.imageReference
                || productionSnapshot.scope !== "full"
                || productionSnapshot.sitesCandidateMatched !== true
              ) {
                fail("finalization does not bind the full post-Sites image");
              }
              if (!Array.isArray(finalizationPayload.gates)) {
                fail("finalization gates are invalid");
              }
              const finalBrowserGates = finalizationPayload.gates.filter(
                (gate) => gate?.name === "final_custom_domain_browser",
              );
              if (
                finalBrowserGates.length !== 1
                || finalBrowserGates[0].passed !== true
                || finalBrowserGates[0].environment !== "production"
                || finalBrowserGates[0].evidenceHash
                  !== metadata.finalBrowserGateEvidenceHash
              ) {
                fail(
                  "finalization does not bind the exact successful final browser gate",
                );
              }

              const authorizationPayload = exact(
                authorization.payload,
                [
                  "schemaVersion",
                  "issuer",
                  "generatedAt",
                  "expiresAt",
                  "action",
                  "candidate",
                  "finalizationEvidencePayloadHash",
                  "finalBrowserGateEvidenceHash",
                  "protectedBaselineMetadataHash",
                ],
                "stable authorization payload",
              );
              const authorizationCandidate = exact(
                authorizationPayload.candidate,
                [
                  "rcTag",
                  "stableTag",
                  "version",
                  "sourceRevision",
                  "imageDigest",
                ],
                "stable authorization candidate",
              );
              authorizationGeneratedAt = timestamp(
                authorizationPayload.generatedAt,
                "stable authorization generatedAt",
              );
              authorizationExpiresAt = timestamp(
                authorizationPayload.expiresAt,
                "stable authorization expiresAt",
              );
              if (
                authorizationPayload.schemaVersion
                  !== "genio-stable-release-authorization/v2"
                || authorizationPayload.issuer
                  !== "genio-protected-stable-release-authorizer"
                || authorizationPayload.action
                  !== "create_stable_tag_and_github_release"
                || authorizationExpiresAt <= authorizationGeneratedAt
                || authorizationExpiresAt - authorizationGeneratedAt
                  > 24 * 60 * 60 * 1000
                || authorizationGeneratedAt < finalizationGeneratedAt
                || authorizationGeneratedAt >= finalizationExpiresAt
                || authorizationExpiresAt > finalizationExpiresAt
                || authorizationCandidate.rcTag !== metadata.rcTag
                || authorizationCandidate.stableTag !== metadata.stableTag
                || authorizationCandidate.version !== metadata.version
                || authorizationCandidate.sourceRevision
                  !== metadata.sourceRevision
                || authorizationCandidate.imageDigest
                  !== metadata.imageDigest
                || authorizationPayload.finalizationEvidencePayloadHash
                  !== finalization.payloadHash
                || authorizationPayload.finalBrowserGateEvidenceHash
                  !== metadata.finalBrowserGateEvidenceHash
                || authorizationPayload.protectedBaselineMetadataHash
                  !== metadataSha256
              ) {
                fail(
                  "stable authorization does not bind the exact finalized baseline",
                );
              }
            } else {
              const bootstrapPayload = exact(
                finalization.payload,
                [
                  "schemaVersion",
                  "issuer",
                  "generatedAt",
                  "expiresAt",
                  "kind",
                  "mode",
                  "candidate",
                  "anchor",
                  "successorPolicy",
                  "controller",
                  "provenance",
                  "independentEvidence",
                  "productionObservation",
                  "fixtures",
                  "fixtureRegistryHash",
                  "gates",
                  "limitations",
                ],
                "bootstrap predecessor evidence payload",
              );
              const bootstrapCandidate = exact(
                bootstrapPayload.candidate,
                [
                  "compatibilityRcTag",
                  "compatibilityRcTagIsSynthetic",
                  "stableTag",
                  "version",
                  "sourceRevision",
                  "sourceTree",
                  "imageDigest",
                  "imageReference",
                ],
                "bootstrap predecessor candidate",
              );
              const bootstrapAnchor = exact(
                bootstrapPayload.anchor,
                [
                  "tagObject",
                  "tagObjectSha256",
                  "tagMessageSha256",
                  "sourceCommitSha256",
                  "sourceTreeObjectSha256",
                ],
                "bootstrap predecessor anchor",
              );
              const successorPolicy = exact(
                bootstrapPayload.successorPolicy,
                [
                  "version",
                  "rcTagPattern",
                  "requiresGreatestLowerStable",
                  "requiresControllerAncestry",
                  "forbidsPublishedStableVersion",
                ],
                "bootstrap successor policy",
              );
              const controller = exact(
                bootstrapPayload.controller,
                [
                  "repository",
                  "defaultBranch",
                  "sourceRevision",
                  "workflow",
                  "workflowSha256",
                ],
                "bootstrap predecessor controller",
              );
              const provenance = exact(
                bootstrapPayload.provenance,
                [
                  "imageAttestationHash",
                  "recoveredRailwayObservationHash",
                  "independentEvidenceHash",
                  "fixtureRegistryHash",
                ],
                "bootstrap predecessor provenance",
              );
              const productionObservation = exact(
                bootstrapPayload.productionObservation,
                [
                  "sourceRevision",
                  "kind",
                  "recoveredRailwayObservationHash",
                  "semanticBaselineScope",
                  "wrapperFixtureEvidenceHash",
                ],
                "bootstrap production observation",
              );
              finalizationGeneratedAt = timestamp(
                bootstrapPayload.generatedAt,
                "bootstrap evidence generatedAt",
              );
              finalizationExpiresAt = timestamp(
                bootstrapPayload.expiresAt,
                "bootstrap evidence expiresAt",
              );
              controllerSourceRevision = String(
                controller.sourceRevision ?? "",
              );
              for (const [label, value] of [
                ["bootstrap anchor tag-object hash", bootstrapAnchor.tagObjectSha256],
                ["bootstrap anchor tag-message hash", bootstrapAnchor.tagMessageSha256],
                ["bootstrap anchor source-commit hash", bootstrapAnchor.sourceCommitSha256],
                ["bootstrap anchor tree-object hash", bootstrapAnchor.sourceTreeObjectSha256],
                ["bootstrap controller workflow hash", controller.workflowSha256],
                ["bootstrap image attestation hash", provenance.imageAttestationHash],
                ["bootstrap Railway observation hash", provenance.recoveredRailwayObservationHash],
                ["bootstrap independent source evidence hash", provenance.independentEvidenceHash],
                ["bootstrap fixture registry hash", provenance.fixtureRegistryHash],
                ["bootstrap wrapper fixture evidence hash", productionObservation.wrapperFixtureEvidenceHash],
              ]) digest(value, label);
              if (
                !BOOTSTRAP_SUCCESSOR_RC.test(process.env.CANDIDATE_TAG ?? "")
                || selected.tag_name !== BOOTSTRAP_STABLE_TAG
                || metadata.rcTag !== BOOTSTRAP_COMPATIBILITY_RC_TAG
                || metadata.stableTag !== BOOTSTRAP_STABLE_TAG
                || metadata.version !== "2.3.4"
                || metadata.sourceRevision !== BOOTSTRAP_SOURCE_REVISION
                || bootstrapPayload.schemaVersion
                  !== "genio-stable-predecessor-bootstrap-evidence/v2"
                || bootstrapPayload.issuer
                  !== "genio-protected-stable-predecessor-bootstrap-producer"
                || bootstrapPayload.kind !== "stable_predecessor_bootstrap"
                || bootstrapPayload.mode
                  !== "recovered_observation_with_separate_reconstruction_wrapper"
                || finalizationExpiresAt <= finalizationGeneratedAt
                || finalizationExpiresAt - finalizationGeneratedAt
                  > 24 * 60 * 60 * 1000
                || bootstrapCandidate.compatibilityRcTag
                  !== BOOTSTRAP_COMPATIBILITY_RC_TAG
                || bootstrapCandidate.compatibilityRcTagIsSynthetic !== true
                || bootstrapCandidate.stableTag !== BOOTSTRAP_STABLE_TAG
                || bootstrapCandidate.version !== "2.3.4"
                || bootstrapCandidate.sourceRevision
                  !== BOOTSTRAP_SOURCE_REVISION
                || bootstrapCandidate.sourceTree !== BOOTSTRAP_SOURCE_TREE
                || bootstrapCandidate.imageDigest !== metadata.imageDigest
                || bootstrapCandidate.imageReference !== metadata.imageReference
                || bootstrapAnchor.tagObject !== BOOTSTRAP_TAG_OBJECT
                || successorPolicy.version !== "2.4.0"
                || successorPolicy.rcTagPattern
                  !== "^v2\\.4\\.0-rc\\.[1-9]\\d*$"
                || successorPolicy.requiresGreatestLowerStable !== true
                || successorPolicy.requiresControllerAncestry !== true
                || successorPolicy.forbidsPublishedStableVersion !== true
                || controller.repository !== `${context.repo.owner}/${context.repo.repo}`
                || controller.defaultBranch
                  !== context.payload.repository.default_branch
                || !SOURCE_REVISION.test(controllerSourceRevision)
                || controller.workflow
                  !== `${context.repo.owner}/${context.repo.repo}/${BOOTSTRAP_CONTROLLER_WORKFLOW}`
                || productionObservation.sourceRevision
                  !== BOOTSTRAP_SOURCE_REVISION
                || productionObservation.kind
                  !== "authenticated_platform_observation_not_supply_chain_attestation"
                || productionObservation.semanticBaselineScope
                  !== "reconstruction_wrapper_only_not_historical_production_equivalence"
                || productionObservation.recoveredRailwayObservationHash
                  !== provenance.recoveredRailwayObservationHash
                || provenance.fixtureRegistryHash
                  !== bootstrapPayload.fixtureRegistryHash
                || finalization.payloadHash
                  !== metadata.finalizationEvidencePayloadHash
              ) {
                fail(
                  "bootstrap evidence is not the exact one-time v2.3.4 predecessor for a v2.4.0 RC",
                );
              }
              if (!Array.isArray(bootstrapPayload.gates)) {
                fail("bootstrap evidence gates are invalid");
              }
              const expectedBootstrapGates = [
                "staging_fixed_three_track",
                "staging_affected_regression",
                "staging_guided_constraint",
                "final_custom_domain_browser",
              ];
              if (
                bootstrapPayload.gates.length !== expectedBootstrapGates.length
                || bootstrapPayload.gates.some((gate, index) =>
                  gate?.name !== expectedBootstrapGates[index]
                  || gate?.passed !== true
                  || gate?.environment !== (
                    gate.name === "final_custom_domain_browser"
                      ? "production"
                      : "staging"
                  )
                  || !SHA256.test(gate?.evidenceHash ?? "")
                )
                || new Set(
                  bootstrapPayload.gates.map(({ evidenceHash }) => evidenceHash),
                ).size !== expectedBootstrapGates.length
                || !Array.isArray(bootstrapPayload.limitations)
                || !bootstrapPayload.limitations.includes(
                  "wrapper_fixture_evidence_does_not_prove_historical_production_output_equivalence",
                )
                || !bootstrapPayload.limitations.includes(
                  "recovered_railway_observations_lacked_registry_reference_manifest_config_and_attestation_bytes",
                )
                || !bootstrapPayload.limitations.includes(
                  "no_historical_railway_artifact_identity_or_equivalence_is_claimed",
                )
              ) {
                fail(
                  "bootstrap evidence does not bind the exact wrapper-only fixture/browser source set",
                );
              }
              const finalBrowserGates = bootstrapPayload.gates.filter(
                (gate) => gate?.name === "final_custom_domain_browser",
              );
              if (
                finalBrowserGates.length !== 1
                || finalBrowserGates[0].passed !== true
                || finalBrowserGates[0].environment !== "production"
                || finalBrowserGates[0].evidenceHash
                  !== metadata.finalBrowserGateEvidenceHash
              ) {
                fail(
                  "bootstrap evidence does not bind the exact production browser gate",
                );
              }

              const authorizationPayload = exact(
                authorization.payload,
                [
                  "schemaVersion",
                  "issuer",
                  "generatedAt",
                  "expiresAt",
                  "action",
                  "candidate",
                  "anchor",
                  "successorPolicy",
                  "controller",
                  "bootstrapEvidencePayloadHash",
                  "protectedBaselineMetadataHash",
                  "imageAttestationHash",
                  "recoveredRailwayObservationHash",
                  "independentEvidenceHash",
                  "fixtureRegistryHash",
                  "finalBrowserGateEvidenceHash",
                  "producerKeyId",
                  "producerKeySha256",
                  "sitesKeyId",
                  "sitesKeySha256",
                  "railwayObservationKind",
                  "wrapperReconstructionMode",
                  "wrapperImageDigest",
                  "historicalArtifactEquivalence",
                  "historicalArtifactIdentity",
                ],
                "bootstrap predecessor authorization payload",
              );
              authorizationGeneratedAt = timestamp(
                authorizationPayload.generatedAt,
                "bootstrap authorization generatedAt",
              );
              authorizationExpiresAt = timestamp(
                authorizationPayload.expiresAt,
                "bootstrap authorization expiresAt",
              );
              if (
                authorizationPayload.schemaVersion
                  !== "genio-stable-predecessor-bootstrap-authorization/v2"
                || authorizationPayload.issuer
                  !== "genio-protected-stable-predecessor-bootstrap-authorizer"
                || authorizationPayload.action
                  !== "publish_immutable_v2_3_4_predecessor_bootstrap"
                || authorizationExpiresAt <= authorizationGeneratedAt
                || authorizationExpiresAt - authorizationGeneratedAt
                  > 24 * 60 * 60 * 1000
                || authorizationGeneratedAt < finalizationGeneratedAt
                || authorizationGeneratedAt >= finalizationExpiresAt
                || authorizationExpiresAt > finalizationExpiresAt
                || stableJson(authorizationPayload.candidate)
                  !== stableJson(bootstrapPayload.candidate)
                || stableJson(authorizationPayload.anchor)
                  !== stableJson(bootstrapPayload.anchor)
                || stableJson(authorizationPayload.successorPolicy)
                  !== stableJson(bootstrapPayload.successorPolicy)
                || stableJson(authorizationPayload.controller)
                  !== stableJson(bootstrapPayload.controller)
                || authorizationPayload.bootstrapEvidencePayloadHash
                  !== finalization.payloadHash
                || authorizationPayload.protectedBaselineMetadataHash
                  !== metadataSha256
                || authorizationPayload.imageAttestationHash
                  !== provenance.imageAttestationHash
                || authorizationPayload.recoveredRailwayObservationHash
                  !== provenance.recoveredRailwayObservationHash
                || authorizationPayload.independentEvidenceHash
                  !== provenance.independentEvidenceHash
                || authorizationPayload.fixtureRegistryHash
                  !== bootstrapPayload.fixtureRegistryHash
                || authorizationPayload.finalBrowserGateEvidenceHash
                  !== metadata.finalBrowserGateEvidenceHash
                || !SIGNING_KEY_ID.test(
                  authorizationPayload.producerKeyId ?? "",
                )
                || !SHA256.test(
                  authorizationPayload.producerKeySha256 ?? "",
                )
                || !SIGNING_KEY_ID.test(
                  authorizationPayload.sitesKeyId ?? "",
                )
                || !SHA256.test(
                  authorizationPayload.sitesKeySha256 ?? "",
                )
                || !IMAGE_DIGEST.test(
                  authorizationPayload.wrapperImageDigest ?? "",
                )
                || authorizationPayload.railwayObservationKind
                  !== "authenticated_platform_observation_not_supply_chain_attestation"
                || authorizationPayload.wrapperReconstructionMode
                  !== "controller_recipe_wrapper_not_historical_railway_artifact"
                || authorizationPayload.wrapperImageDigest
                  !== bootstrapCandidate.imageDigest
                || authorizationPayload.historicalArtifactEquivalence
                  !== "not_claimed"
                || authorizationPayload.historicalArtifactIdentity !== null
                || new Set([
                  authorizationPayload.producerKeySha256,
                  authorizationPayload.sitesKeySha256,
                ]).size !== 2
              ) {
                fail(
                  "bootstrap authorization does not bind the exact predecessor evidence",
                );
              }
              const successorReleaseExists = releases.some(
                (release) => release.tag_name === "v2.4.0",
              );
              let successorTagExists = false;
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: "tags/v2.4.0",
                });
                successorTagExists = true;
              } catch (error) {
                if (Number(error?.status) !== 404) throw error;
              }
              if (successorReleaseExists || successorTagExists) {
                fail(
                  "v2.3.4 bootstrap consumption closes once v2.4.0 is published or tagged",
                );
              }
              imageSignerWorkflow = BOOTSTRAP_IMAGE_WORKFLOW;
              imageSignerSourceDigest = controllerSourceRevision;
            }

            const consumer = exact(
              parseJson(
                assetBytes.get("stable-release-consumer.json"),
                "stable release consumer manifest",
              ),
              [
                "schemaVersion",
                "verifiedAt",
                "candidate",
                "finalizationEvidencePayloadHash",
                "finalBrowserGateEvidenceHash",
                "protectedBaselineMetadataHash",
                "stableAuthorizationPayloadHash",
                "releaseVerificationKeySha256",
                "stableAuthorizerKeyId",
                "stableAuthorizerKeySha256",
              ],
              "stable release consumer manifest",
            );
            const consumerCandidate = exact(
              consumer.candidate,
              [
                "rcTag",
                "stableTag",
                "version",
                "sourceRevision",
                "imageDigest",
                "imageReference",
              ],
              "stable release consumer candidate",
            );
            const verifiedAt = timestamp(
              consumer.verifiedAt,
              "stable release consumer verifiedAt",
            );
            const releaseKeySha256 = digest(
              consumer.releaseVerificationKeySha256,
              "historical release verification key fingerprint",
            );
            const stableAuthorizerKeySha256 = digest(
              consumer.stableAuthorizerKeySha256,
              "historical stable-authorizer key fingerprint",
            );
            if (
              consumer.schemaVersion
                !== "genio-stable-release-consumer-manifest/v2"
              || consumerCandidate.rcTag !== metadata.rcTag
              || consumerCandidate.stableTag !== metadata.stableTag
              || consumerCandidate.version !== metadata.version
              || consumerCandidate.sourceRevision !== metadata.sourceRevision
              || consumerCandidate.imageDigest !== metadata.imageDigest
              || consumerCandidate.imageReference !== metadata.imageReference
              || consumer.finalizationEvidencePayloadHash
                !== finalization.payloadHash
              || consumer.finalBrowserGateEvidenceHash
                !== metadata.finalBrowserGateEvidenceHash
              || consumer.protectedBaselineMetadataHash !== metadataSha256
              || consumer.stableAuthorizationPayloadHash
                !== authorization.payloadHash
              || consumer.stableAuthorizerKeyId
                !== authorization.signature.keyId
              || !STABLE_AUTHORIZER_KEY_ID.test(
                consumer.stableAuthorizerKeyId ?? "",
              )
              || releaseKeySha256 === stableAuthorizerKeySha256
              || (
                predecessorMode === "bootstrap"
                && new Set([
                  releaseKeySha256,
                  stableAuthorizerKeySha256,
                  authorization.payload.producerKeySha256,
                  authorization.payload.sitesKeySha256,
                ]).size !== 4
              )
              || verifiedAt < authorizationGeneratedAt - 5 * 60 * 1000
              || verifiedAt >= authorizationExpiresAt
              || verifiedAt >= finalizationExpiresAt
            ) {
              fail("stable consumer manifest does not match the signed release lineage");
            }

            let imageAttestation;
            try {
              imageAttestation = JSON.parse(
                assetBytes.get("stable-image-attestation.json").toString("utf8"),
              );
            } catch {
              fail("stable image attestation verification result is not JSON");
            }
            if (
              !imageAttestation
              || typeof imageAttestation !== "object"
            ) {
              fail("stable image attestation verification result is empty");
            }
            if (predecessorMode === "bootstrap") {
              imageAttestation = exact(
                imageAttestation,
                [
                  "schemaVersion",
                  "repository",
                  "workflow",
                  "workflowRef",
                  "workflowSourceRevision",
                  "controllerRecipeSourceRevision",
                  "controllerRecipeSha256",
                  "historicalBuildIntentSha256",
                  "builderIdentity",
                  "reconstructionMode",
                  "historicalArtifactEquivalence",
                  "historicalArtifactIdentity",
                  "subjectImageReference",
                  "subjectImageDigest",
                  "historicalSourceRevision",
                  "historicalSourceTree",
                  "recoveredRailwayObservation",
                  "recoveredRailwayObservationHash",
                  "githubVerificationHash",
                  "predicateType",
                  "runnerEnvironment",
                ],
                "bootstrap image attestation",
              );
              imageGithubVerificationHash = digest(
                imageAttestation.githubVerificationHash,
                "bootstrap image GitHub verification hash",
              );
              if (
                imageAttestation.schemaVersion
                  !== "genio-stable-predecessor-bootstrap-image-attestation/v2"
                || imageAttestation.repository
                  !== `${context.repo.owner}/${context.repo.repo}`
                || imageAttestation.workflow
                  !== `${context.repo.owner}/${context.repo.repo}/${BOOTSTRAP_IMAGE_WORKFLOW}`
                || imageAttestation.workflowRef
                  !== `refs/heads/${context.payload.repository.default_branch}`
                || imageAttestation.workflowSourceRevision
                  !== controllerSourceRevision
                || imageAttestation.controllerRecipeSourceRevision
                  !== controllerSourceRevision
                || imageAttestation.reconstructionMode
                  !== "controller_recipe_wrapper_not_historical_railway_artifact"
                || imageAttestation.historicalArtifactEquivalence
                  !== "not_claimed"
                || imageAttestation.historicalArtifactIdentity !== null
                || imageAttestation.recoveredRailwayObservation?.kind
                  !== "authenticated_platform_observation_not_supply_chain_attestation"
                || imageAttestation.recoveredRailwayObservation?.capture
                  ?.registryReferenceRecovered !== false
                || imageAttestation.recoveredRailwayObservation?.capture
                  ?.manifestBytesRecovered !== false
                || imageAttestation.recoveredRailwayObservation?.capture
                  ?.supplyChainAttestationRecovered !== false
                || imageAttestation.subjectImageReference
                  !== metadata.imageReference
                || imageAttestation.subjectImageDigest
                  !== metadata.imageDigest
                || imageAttestation.historicalSourceRevision
                  !== BOOTSTRAP_SOURCE_REVISION
                || imageAttestation.historicalSourceTree
                  !== BOOTSTRAP_SOURCE_TREE
                || imageAttestation.predicateType
                  !== "https://slsa.dev/provenance/v1"
                || imageAttestation.runnerEnvironment !== "github-hosted"
                || stableSha256(imageAttestation)
                  !== authorization.payload.imageAttestationHash
              ) {
                fail(
                  "bootstrap image attestation does not bind the exact controller and signed authorization",
                );
              }
            }

            if (
              selected.target_commitish !== metadata.sourceRevision
              || selected.tag_name !== metadata.stableTag
            ) {
              fail("GitHub Release target does not match protected baseline metadata");
            }
            const requiredReleaseNoteLines = predecessorMode === "bootstrap"
              ? [
                  "gênio wrapper-backed stable predecessor v2.3.4",
                  "Compatibility-RC: v2.3.4-rc.1",
                  `Original-Tag-Object: ${BOOTSTRAP_TAG_OBJECT}`,
                  `Original-Source-Revision: ${BOOTSTRAP_SOURCE_REVISION}`,
                  `Original-Source-Tree: ${BOOTSTRAP_SOURCE_TREE}`,
                  `Wrapper-Image-Digest: ${metadata.imageDigest}`,
                  "Railway-Observation-Kind: authenticated_platform_observation_not_supply_chain_attestation",
                  "Wrapper-Limitation: not historical Railway artifact",
                  "Historical-Artifact-Equivalence: not claimed",
                  "Historical-Artifact-Identity: unavailable",
                  `Bootstrap-Evidence-SHA256: ${finalization.payloadHash}`,
                  `Protected-Semantic-Baseline-SHA256: ${metadataSha256}`,
                  `Bootstrap-Authorization-SHA256: ${authorization.payloadHash}`,
                  `Bootstrap-Controller-Revision: ${controllerSourceRevision}`,
                  `Bootstrap-Workflow: ${context.repo.owner}/${context.repo.repo}/${BOOTSTRAP_CONTROLLER_WORKFLOW}`,
                ]
              : [
                  `gênio stable release ${metadata.stableTag}`,
                  `RC: ${metadata.rcTag}`,
                  `Source-Revision: ${metadata.sourceRevision}`,
                  `Image-Digest: ${metadata.imageDigest}`,
                  `Finalization-Evidence-SHA256: ${finalization.payloadHash}`,
                  `Protected-Semantic-Baseline-SHA256: ${metadataSha256}`,
                  `Stable-Authorization-SHA256: ${authorization.payloadHash}`,
                ];
            const releaseNoteLines = new Set(
              String(selected.body ?? "").split("\n"),
            );
            if (
              requiredReleaseNoteLines.some((line) => !releaseNoteLines.has(line))
            ) {
              fail("GitHub Release notes do not bind the exact signed lineage");
            }

            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${selected.tag_name}`,
            });
            if (tagRef.data.object.type !== "tag") {
              fail("stable predecessor tag is not annotated");
            }
            const annotatedTag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: tagRef.data.object.sha,
            });
            if (
              annotatedTag.data.tag !== selected.tag_name
              || annotatedTag.data.object.type !== "commit"
              || annotatedTag.data.object.sha !== metadata.sourceRevision
              || (
                predecessorMode === "bootstrap"
                  ? (
                      tagRef.data.object.sha !== BOOTSTRAP_TAG_OBJECT
                      || annotatedTag.data.message !== "Release v2.3.4\n"
                    )
                  : annotatedTag.data.message !== selected.body
              )
            ) {
              fail(
                "annotated stable tag does not bind the protected source and release notes",
              );
            }
            const ancestry = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${metadata.sourceRevision}...${process.env.CANDIDATE_SHA}`,
            });
            if (
              ancestry.data.status !== "ahead"
              || ancestry.data.merge_base_commit?.sha !== metadata.sourceRevision
            ) {
              fail("stable predecessor source is not an ancestor of the RC candidate");
            }
            if (predecessorMode === "bootstrap") {
              const sourceCommit = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: BOOTSTRAP_SOURCE_REVISION,
              });
              const controllerAncestry =
                await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead:
                    `${controllerSourceRevision}...${process.env.CANDIDATE_SHA}`,
                });
              if (
                sourceCommit.data.tree.sha !== BOOTSTRAP_SOURCE_TREE
                || (
                  controllerSourceRevision
                    !== process.env.CANDIDATE_SHA
                  && (
                    controllerAncestry.data.status !== "ahead"
                    || controllerAncestry.data.merge_base_commit?.sha
                      !== controllerSourceRevision
                  )
                )
              ) {
                fail(
                  "bootstrap source tree or protected controller ancestry does not bind the RC",
                );
              }
            }

            const releaseIdentitySha256 = stableSha256({
              releaseId: selected.id,
              stableTag: metadata.stableTag,
              sourceRevision: metadata.sourceRevision,
              metadataSha256,
              assetSha256,
            });
            core.setOutput("release_id", String(selected.id));
            core.setOutput("stable_tag", metadata.stableTag);
            core.setOutput("rc_tag", metadata.rcTag);
            core.setOutput("version", metadata.version);
            core.setOutput("source_revision", metadata.sourceRevision);
            core.setOutput("image_digest", metadata.imageDigest);
            core.setOutput("image_reference", metadata.imageReference);
            core.setOutput("predecessor_mode", predecessorMode);
            core.setOutput(
              "controller_source_revision",
              controllerSourceRevision ?? imageSignerSourceDigest,
            );
            core.setOutput("image_signer_workflow", imageSignerWorkflow);
            core.setOutput(
              "image_signer_source_digest",
              imageSignerSourceDigest,
            );
            core.setOutput(
              "image_github_verification_hash",
              imageGithubVerificationHash ?? "",
            );
            core.setOutput("metadata_sha256", metadataSha256);
            core.setOutput("release_key_sha256", releaseKeySha256);
            core.setOutput(
              "stable_authorizer_key_id",
              consumer.stableAuthorizerKeyId,
            );
            core.setOutput(
              "stable_authorizer_key_sha256",
              stableAuthorizerKeySha256,
            );
            core.setOutput(
              "asset_sha256_json_b64url",
              Buffer.from(JSON.stringify(assetSha256), "utf8").toString("base64url"),
            );
            core.setOutput(
              "release_identity_sha256",
              releaseIdentitySha256,
            );
      - name: Reverify the predecessor image's keyless provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_IMAGE_REFERENCE: ${{ steps.stable_predecessor.outputs.image_reference }}
          BASELINE_SIGNER_WORKFLOW: ${{ steps.stable_predecessor.outputs.image_signer_workflow }}
          BASELINE_SIGNER_SOURCE_DIGEST: ${{ steps.stable_predecessor.outputs.image_signer_source_digest }}
          PREDECESSOR_MODE: ${{ steps.stable_predecessor.outputs.predecessor_mode }}
          EXPECTED_GITHUB_VERIFICATION_HASH: ${{ steps.stable_predecessor.outputs.image_github_verification_hash }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh attestation verify "oci://$BASELINE_IMAGE_REFERENCE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$BASELINE_SIGNER_WORKFLOW" \
            --source-ref "refs/heads/$DEFAULT_BRANCH" \
            --source-digest "$BASELINE_SIGNER_SOURCE_DIGEST" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --deny-self-hosted-runners \
            --format json > semantic-baseline-handoff/predecessor-image-attestation-verification.json
          node -e 'const crypto=require("node:crypto"); const fs=require("node:fs"); const bytes=fs.readFileSync("semantic-baseline-handoff/predecessor-image-attestation-verification.json"); if(bytes.length===0||bytes.length>2*1024*1024) throw new Error("fresh predecessor GitHub verification is empty or oversized"); const value=JSON.parse(bytes.toString("utf8")); if(!value||typeof value!=="object") throw new Error("fresh predecessor GitHub verification must be structured JSON"); if(process.env.PREDECESSOR_MODE==="bootstrap"){const stable=(item)=>JSON.stringify(item&&typeof item==="object"?(Array.isArray(item)?item.map((entry)=>JSON.parse(stable(entry))):Object.fromEntries(Object.entries(item).sort(([left],[right])=>left.localeCompare(right)).map(([key,entry])=>[key,JSON.parse(stable(entry))]))):item); const observed=crypto.createHash("sha256").update(stable(value)).digest("hex"); if(!/^[0-9a-f]{64}$/.test(process.env.EXPECTED_GITHUB_VERIFICATION_HASH??"")||observed!==process.env.EXPECTED_GITHUB_VERIFICATION_HASH) throw new Error("fresh GitHub verification does not match the bootstrap image attestation canonical hash");}else if(process.env.PREDECESSOR_MODE!=="normal"||process.env.EXPECTED_GITHUB_VERIFICATION_HASH!==""){throw new Error("predecessor schema mode and GitHub verification binding differ");}'
      - name: Materialize the selected predecessor's historical public keys
        env:
          HISTORICAL_RELEASE_PUBLIC_KEY_B64URL: ${{ secrets.RELEASE_SEMANTIC_BASELINE_RELEASE_PUBLIC_KEY_B64URL }}
          HISTORICAL_STABLE_AUTHORIZER_PUBLIC_KEY_B64URL: ${{ secrets.RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_PUBLIC_KEY_B64URL }}
        run: |
          node -e 'const fs=require("node:fs"); const inputs=[["HISTORICAL_RELEASE_PUBLIC_KEY_B64URL","semantic-baseline-handoff/release-verification-public-key.pem"],["HISTORICAL_STABLE_AUTHORIZER_PUBLIC_KEY_B64URL","semantic-baseline-handoff/stable-authorizer-public-key.pem"]]; for(const [name,path] of inputs){const value=process.env[name]??""; if(!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error(`${name} must be canonical unpadded base64url`); const bytes=Buffer.from(value,"base64url"); if(bytes.length===0||bytes.toString("base64url")!==value) throw new Error(`${name} must be canonical unpadded base64url`); fs.writeFileSync(path,bytes,{flag:"wx",mode:0o600});}'
      - name: Reverify the predecessor through the shared strict dispatcher
