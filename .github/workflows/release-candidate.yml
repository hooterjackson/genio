          EXPECTED_PREDECESSOR_RC_TAG: ${{ steps.stable_predecessor.outputs.rc_tag }}
          EXPECTED_PREDECESSOR_VERSION: ${{ steps.stable_predecessor.outputs.version }}
          EXPECTED_PREDECESSOR_REVISION: ${{ steps.stable_predecessor.outputs.source_revision }}
          EXPECTED_PREDECESSOR_IMAGE_DIGEST: ${{ steps.stable_predecessor.outputs.image_digest }}
          EXPECTED_PREDECESSOR_IMAGE_REFERENCE: ${{ steps.stable_predecessor.outputs.image_reference }}
          EXPECTED_CONTROLLER_SOURCE_REVISION: ${{ steps.stable_predecessor.outputs.controller_source_revision }}
          EXPECTED_RELEASE_KEY_SHA256: ${{ steps.stable_predecessor.outputs.release_key_sha256 }}
          EXPECTED_STABLE_AUTHORIZER_KEY_ID: ${{ steps.stable_predecessor.outputs.stable_authorizer_key_id }}
