      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-baseline-github-verification-${{ steps.identity.outputs.candidate_tag }}
          path: semantic-baseline-handoff/predecessor-image-attestation-verification.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  validate_offline:
    needs: [authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: needle
          POSTGRES_USER: needle
          POSTGRES_PASSWORD: needle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needle -d needle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANDIDATE_TAG: ${{ needs.authorize.outputs.candidate_tag }}
      CANDIDATE_TAG_OBJECT: ${{ needs.authorize.outputs.candidate_tag_object }}
      CANDIDATE_TAG_TARGET: ${{ needs.authorize.outputs.candidate_tag_target }}
      CONTROLLER_REVISION: ${{ needs.authorize.outputs.controller_revision }}
      DATABASE_URL: postgresql://needle:needle@127.0.0.1:5432/needle
      APP_ORIGIN: http://localhost:3000
      RAILWAY_API_BASE: http://127.0.0.1:8788
      GATEWAY_KEY_ID: rc-v1
      GATEWAY_HMAC_SECRET: 0123456789abcdef0123456789abcdef
      IP_HASH_SECRET: abcdef0123456789abcdef0123456789
      CAPABILITY_PEPPER: fedcba9876543210fedcba9876543210
      CAPABILITY_PEPPER_VERSION: rc-capability-v1
      SESSION_SECRET: 00112233445566778899aabbccddeeff
      OWNER_EMAIL: owner@example.com
      OWNER_ALLOWLIST_VERSION: rc-owner-allowlist-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck the exact immutable predecessor before publication
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_SHA: ${{ needs.authorize.outputs.source_revision }}
          CANDIDATE_TAG: ${{ needs.authorize.outputs.candidate_tag }}
          EXPECTED_RELEASE_ID: ${{ needs.authorize.outputs.semantic_baseline_release_id }}
          EXPECTED_STABLE_TAG: ${{ needs.authorize.outputs.semantic_baseline_stable_tag }}
          EXPECTED_METADATA_SHA256: ${{ needs.authorize.outputs.semantic_baseline_metadata_sha256 }}
          EXPECTED_RELEASE_IDENTITY_SHA256: ${{ needs.authorize.outputs.semantic_baseline_release_identity_sha256 }}
          EXPECTED_ASSET_SHA256_JSON_B64URL: ${{ needs.authorize.outputs.semantic_baseline_asset_sha256_json_b64url }}
        with:
          script: |
            const { createHash } = require("node:crypto");
            const SHA256 = /^[0-9a-f]{64}$/u;
            const STABLE_TAG =
              /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const RC_TAG =
              /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))-rc\.[1-9]\d*$/u;
            const expectedAssetNames = [
              "finalization-evidence.json",
              "protected-semantic-baseline.json",
              "stable-authorization.json",
              "stable-image-attestation.json",
              "stable-release-consumer.json",
            ];
            const fail = (message) => {
              throw new Error(`immutable stable predecessor recheck: ${message}`);
            };
            const sortedJsonValue = (value) => {
              if (Array.isArray(value)) return value.map(sortedJsonValue);
              if (!value || typeof value !== "object") return value;
              return Object.fromEntries(
                Object.entries(value)
                  .sort(([left], [right]) => left.localeCompare(right))
                  .map(([key, item]) => [key, sortedJsonValue(item)]),
              );
            };
            const stableSha256 = (value) => createHash("sha256")
              .update(JSON.stringify(sortedJsonValue(value)))
              .digest("hex");
            const responseBytes = (data, label) => {
              if (data instanceof ArrayBuffer) return Buffer.from(data);
              if (ArrayBuffer.isView(data)) {
                return Buffer.from(data.buffer, data.byteOffset, data.byteLength);
              }
              if (typeof data === "string") return Buffer.from(data, "utf8");
              fail(`${label} did not return raw asset bytes`);
            };
            const versionTuple = (tag) => {
              const match = STABLE_TAG.exec(tag);
              return match
                ? [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])]
                : null;
            };
            const compareVersion = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            };

            const releaseId = Number(process.env.EXPECTED_RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              fail("authorized release ID is invalid");
            }
            const candidateMatch = RC_TAG.exec(process.env.CANDIDATE_TAG ?? "");
            const candidateVersion = candidateMatch
              ? versionTuple(`v${candidateMatch[1]}`)
              : null;
            if (!candidateVersion) fail("authorized RC version is invalid");
            const encodedAssetHashes =
              process.env.EXPECTED_ASSET_SHA256_JSON_B64URL ?? "";
            let expectedAssetSha256;
            try {
              const decoded = Buffer.from(encodedAssetHashes, "base64url");
              if (decoded.toString("base64url") !== encodedAssetHashes) {
                fail("authorized asset hash map is not canonical base64url");
              }
              expectedAssetSha256 = JSON.parse(decoded.toString("utf8"));
            } catch (error) {
              if (error instanceof Error && error.message.startsWith("immutable")) {
                throw error;
              }
              fail("authorized asset hash map is invalid");
            }
            if (
              !expectedAssetSha256
              || typeof expectedAssetSha256 !== "object"
              || Array.isArray(expectedAssetSha256)
              || JSON.stringify(Object.keys(expectedAssetSha256).sort())
                !== JSON.stringify(expectedAssetNames)
              || expectedAssetNames.some(
                (name) => !SHA256.test(expectedAssetSha256[name] ?? ""),
              )
            ) {
              fail("authorized asset hash map has the wrong inventory");
            }

            const [byId, byTag, releases, stableTagRefs] = await Promise.all([
              github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
              github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.EXPECTED_STABLE_TAG,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
              github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              }),
            ]);
            const release = byId.data;
            const stableTagAtOrAboveCandidate = stableTagRefs.some((ref) => {
              const tuple = versionTuple(ref.ref?.replace(/^refs\/tags\//u, "") ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            const stableReleaseAtOrAboveCandidate = releases.some((item) => {
              const tuple = versionTuple(item.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            if (
              stableTagAtOrAboveCandidate
              || stableReleaseAtOrAboveCandidate
            ) {
              fail(
                "candidate version is no longer greater than every stable tag and release",
              );
            }
            const lowerStableVersions = releases.flatMap((item) => {
              const tuple = versionTuple(item.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) < 0
                ? [{ item, tuple }]
                : [];
            });
            lowerStableVersions.sort(
              (left, right) => compareVersion(right.tuple, left.tuple),
            );
            if (
              lowerStableVersions[0]?.item.id !== releaseId
              || byTag.data.id !== releaseId
              || release.id !== releaseId
              || release.tag_name !== process.env.EXPECTED_STABLE_TAG
              || release.name !== process.env.EXPECTED_STABLE_TAG
              || release.draft !== false
              || release.prerelease !== false
              || release.immutable !== true
            ) {
              fail("authorized release identity or immutable state changed");
            }
            const assets = release.assets ?? [];
            if (
              JSON.stringify(assets.map(({ name }) => name).sort())
                !== JSON.stringify(expectedAssetNames)
            ) {
              fail("authorized release asset inventory changed");
            }
            const observedAssetSha256 = {};
            let metadata;
            for (const name of expectedAssetNames) {
              const matches = assets.filter((asset) => asset.name === name);
              if (
                matches.length !== 1
                || matches[0].state !== "uploaded"
                || !Number.isSafeInteger(matches[0].size)
                || matches[0].size <= 0
              ) {
                fail(`authorized release asset ${name} is invalid`);
              }
              const response = await github.request(
                "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: matches[0].id,
                  headers: {
                    accept: "application/octet-stream",
                    "X-GitHub-Api-Version": "2026-03-10",
                  },
                },
              );
              const bytes = responseBytes(response.data, name);
              const observed = createHash("sha256").update(bytes).digest("hex");
              if (
                bytes.length !== matches[0].size
                || observed !== expectedAssetSha256[name]
                || (
                  typeof matches[0].digest === "string"
                  && matches[0].digest !== `sha256:${observed}`
                )
              ) {
                fail(`authorized release asset ${name} bytes changed`);
              }
              observedAssetSha256[name] = observed;
              if (name === "protected-semantic-baseline.json") {
                try {
                  metadata = JSON.parse(bytes.toString("utf8"));
                } catch {
                  fail("protected semantic baseline metadata is no longer JSON");
                }
              }
            }
            if (
              !metadata
              || stableSha256(metadata)
                !== process.env.EXPECTED_METADATA_SHA256
              || metadata.stableTag !== process.env.EXPECTED_STABLE_TAG
              || metadata.sourceRevision !== release.target_commitish
            ) {
              fail("protected semantic baseline metadata identity changed");
            }
            const releaseIdentitySha256 = stableSha256({
              releaseId,
              stableTag: metadata.stableTag,
              sourceRevision: metadata.sourceRevision,
              metadataSha256: process.env.EXPECTED_METADATA_SHA256,
              assetSha256: observedAssetSha256,
            });
            if (
              releaseIdentitySha256
                !== process.env.EXPECTED_RELEASE_IDENTITY_SHA256
            ) {
              fail("authorized release identity hash changed");
            }

            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${metadata.stableTag}`,
            });
            if (tagRef.data.object.type !== "tag") {
              fail("authorized stable tag is no longer annotated");
            }
            const annotatedTag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: tagRef.data.object.sha,
            });
            if (
              annotatedTag.data.object.type !== "commit"
              || annotatedTag.data.object.sha !== metadata.sourceRevision
            ) {
              fail("authorized annotated stable tag target changed");
            }
            const ancestry = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead:
                `${metadata.sourceRevision}...${process.env.CANDIDATE_SHA}`,
            });
            if (
              ancestry.data.status !== "ahead"
              || ancestry.data.merge_base_commit?.sha !== metadata.sourceRevision
            ) {
              fail("authorized stable predecessor is no longer an RC ancestor");
            }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Verify annotated RC identity
        run: |
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG")" = "$CANDIDATE_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG^{}")" = "$CANDIDATE_TAG_TARGET"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_TAG_TARGET"
          node scripts/check-release.mjs --require-exact-tag "$CANDIDATE_TAG"
      - run: pnpm install --frozen-lockfile
      - name: Reclaim known package-manager caches before build
        run: |
          pnpm store prune
          sudo apt-get clean
      - name: Require build disk headroom
        run: |
          FREE_KIB="$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          MIN_FREE_KIB="$((8 * 1024 * 1024))"
          echo "Release validation free space: $((FREE_KIB / 1024)) MiB"
          if [ "$FREE_KIB" -lt "$MIN_FREE_KIB" ]; then
            echo "At least 8 GiB of free disk is required before release validation." >&2
            exit 1
          fi
      - name: Run immutable-artifact and database checks
        run: |
          pnpm security:secrets
          pnpm security:dependencies
          pnpm lint
          pnpm build
          pnpm release:fixtures:check
          pnpm qa:policy:check
          pnpm test:database:preflight
          pnpm db:migrate
      - name: Reclaim known package-manager caches before coverage
        run: |
          pnpm store prune
          sudo apt-get clean
      - name: Require coverage disk headroom
        run: |
          FREE_KIB="$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          MIN_FREE_KIB="$((8 * 1024 * 1024))"
          echo "Release validation free space: $((FREE_KIB / 1024)) MiB"
          if [ "$FREE_KIB" -lt "$MIN_FREE_KIB" ]; then
            echo "At least 8 GiB of free disk is required before release validation." >&2
