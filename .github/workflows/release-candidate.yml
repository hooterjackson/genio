        run: pnpm test:e2e:system
      - name: Upload stitched-system failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-system-failure-${{ env.CANDIDATE_TAG }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [authorize, validate_offline, validate_browser, validate_production_database, validate_system]
    if: ${{ needs.authorize.result == 'success' && needs.validate_offline.result == 'success' && needs.validate_browser.result == 'success' && needs.validate_production_database.result == 'success' && needs.validate_system.result == 'success' }}
    environment: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      CANDIDATE_TAG: ${{ needs.authorize.outputs.candidate_tag }}
      CANDIDATE_TAG_OBJECT: ${{ needs.authorize.outputs.candidate_tag_object }}
      CANDIDATE_TAG_TARGET: ${{ needs.authorize.outputs.candidate_tag_target }}
      CONTROLLER_REVISION: ${{ needs.authorize.outputs.controller_revision }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
      IMAGE: ${{ needs.authorize.outputs.image }}
      RELEASE_VERIFICATION_KEY_SHA256: ${{ needs.authorize.outputs.release_verification_key_sha256 }}
      RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256: ${{ needs.authorize.outputs.public_rollout_intent_canary_authority_policy_sha256 }}
      RELEASE_SEMANTIC_BASELINE_METADATA_SHA256: ${{ needs.authorize.outputs.semantic_baseline_metadata_sha256 }}
      RELEASE_SEMANTIC_BASELINE_STABLE_TAG: ${{ needs.authorize.outputs.semantic_baseline_stable_tag }}
      RELEASE_SEMANTIC_BASELINE_RELEASE_KEY_SHA256: ${{ needs.authorize.outputs.semantic_baseline_release_key_sha256 }}
      RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_ID: ${{ needs.authorize.outputs.semantic_baseline_stable_authorizer_key_id }}
      RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_SHA256: ${{ needs.authorize.outputs.semantic_baseline_stable_authorizer_key_sha256 }}
      RELEASE_SEMANTIC_BASELINE_PREDECESSOR_MODE: ${{ needs.authorize.outputs.semantic_baseline_predecessor_mode }}
      RELEASE_SEMANTIC_BASELINE_CONTROLLER_SOURCE_REVISION: ${{ needs.authorize.outputs.semantic_baseline_controller_source_revision }}
      RELEASE_SEMANTIC_BASELINE_GITHUB_ATTESTATION_VERIFICATION_BYTES_SHA256: ${{ needs.authorize.outputs.semantic_baseline_github_attestation_verification_bytes_sha256 }}
      RELEASE_SEMANTIC_BASELINE_HANDOFF_SHA256: ${{ needs.authorize.outputs.semantic_baseline_handoff_sha256 }}
      RELEASE_STABLE_AUTHORIZER_KEY_ID: ${{ needs.authorize.outputs.stable_authorizer_key_id }}
      RELEASE_STABLE_AUTHORIZER_KEY_SHA256: ${{ needs.authorize.outputs.stable_authorizer_key_sha256 }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      source_revision: ${{ needs.authorize.outputs.source_revision }}
      version: ${{ needs.authorize.outputs.version }}
      image: ${{ needs.authorize.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semantic-baseline-handoff-${{ needs.authorize.outputs.candidate_tag }}
          path: semantic-baseline-handoff
      - name: Reconfirm the predecessor is still greatest before image publication
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_TAG: ${{ needs.authorize.outputs.candidate_tag }}
          EXPECTED_RELEASE_ID: ${{ needs.authorize.outputs.semantic_baseline_release_id }}
          EXPECTED_STABLE_TAG: ${{ needs.authorize.outputs.semantic_baseline_stable_tag }}
        with:
          script: |
            const STABLE_TAG =
              /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const RC_TAG =
              /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))-rc\.[1-9]\d*$/u;
            const versionTuple = (tag) => {
              const match = STABLE_TAG.exec(tag);
              return match
                ? [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])]
                : null;
            };
            const compareVersion = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            };
            const candidateMatch = RC_TAG.exec(process.env.CANDIDATE_TAG ?? "");
            const candidateVersion = candidateMatch
              ? versionTuple(`v${candidateMatch[1]}`)
              : null;
            const expectedReleaseId = Number(process.env.EXPECTED_RELEASE_ID);
            if (
              !candidateVersion
              || !Number.isSafeInteger(expectedReleaseId)
              || expectedReleaseId <= 0
            ) {
              throw new Error("authorized immutable predecessor identity is invalid");
            }
            const [releases, stableTagRefs] = await Promise.all([
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
              github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              }),
            ]);
            const stableTagAtOrAboveCandidate = stableTagRefs.some((ref) => {
              const tuple = versionTuple(ref.ref?.replace(/^refs\/tags\//u, "") ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            const stableReleaseAtOrAboveCandidate = releases.some((release) => {
              const tuple = versionTuple(release.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) >= 0;
            });
            if (
              stableTagAtOrAboveCandidate
              || stableReleaseAtOrAboveCandidate
            ) {
              throw new Error(
                "candidate version is no longer greater than every stable tag and release",
              );
            }
            const lowerStableVersions = releases.flatMap((release) => {
              const tuple = versionTuple(release.tag_name ?? "");
              return tuple && compareVersion(tuple, candidateVersion) < 0
                ? [{ release, tuple }]
                : [];
            });
            lowerStableVersions.sort(
              (left, right) => compareVersion(right.tuple, left.tuple),
            );
            const predecessor = lowerStableVersions[0]?.release;
            if (
              predecessor?.id !== expectedReleaseId
              || predecessor.tag_name !== process.env.EXPECTED_STABLE_TAG
              || predecessor.draft !== false
              || predecessor.prerelease !== false
              || predecessor.immutable !== true
            ) {
              throw new Error(
                "authorized release is no longer the greatest published immutable stable predecessor",
              );
            }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Reverify the sealed semantic baseline handoff
        run: |
          node --experimental-transform-types scripts/semantic-baseline-handoff.ts verify \
            --directory semantic-baseline-handoff \
            --expected-manifest-sha256 "$RELEASE_SEMANTIC_BASELINE_HANDOFF_SHA256" \
            --candidate-tag "$CANDIDATE_TAG" \
            --candidate-source-revision "$SOURCE_REVISION" \
            --metadata-sha256 "$RELEASE_SEMANTIC_BASELINE_METADATA_SHA256" \
            --stable-tag "$RELEASE_SEMANTIC_BASELINE_STABLE_TAG" \
            --predecessor-mode "$RELEASE_SEMANTIC_BASELINE_PREDECESSOR_MODE" \
            --predecessor-controller-source-revision "$RELEASE_SEMANTIC_BASELINE_CONTROLLER_SOURCE_REVISION" \
            --release-verification-key-sha256 "$RELEASE_SEMANTIC_BASELINE_RELEASE_KEY_SHA256" \
            --stable-authorizer-key-id "$RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_ID" \
            --stable-authorizer-key-sha256 "$RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_SHA256"
      - name: Reverify exact validated source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node -p 'require(\"./package.json\").version')" = "$RELEASE_VERSION"
          node scripts/check-release.mjs --require-exact-tag "$CANDIDATE_TAG"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reclaim known package-manager caches before image build
        run: |
          pnpm store prune
          sudo apt-get clean
      - name: Require image-build disk headroom
        run: |
          FREE_KIB="$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          MIN_FREE_KIB="$((8 * 1024 * 1024))"
          echo "Release publication free space: $((FREE_KIB / 1024)) MiB"
          if [ "$FREE_KIB" -lt "$MIN_FREE_KIB" ]; then
            echo "At least 8 GiB of free disk is required before image publication." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build the candidate image without registry mutation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            GENIO_BUILD_VERSION=${{ needs.authorize.outputs.version }}
            GENIO_BUILD_REVISION=${{ needs.authorize.outputs.source_revision }}
            GENIO_RELEASE_VERIFICATION_KEY_SHA256=${{ needs.authorize.outputs.release_verification_key_sha256 }}
            GENIO_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256=${{ needs.authorize.outputs.public_rollout_intent_canary_authority_policy_sha256 }}
          tags: |
            ${{ needs.authorize.outputs.image }}:${{ needs.authorize.outputs.candidate_tag }}
            ${{ needs.authorize.outputs.image }}:sha-${{ needs.authorize.outputs.source_revision }}
      - name: Recheck stable monotonicity after build and immediately before image push
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_RELEASE_ID: ${{ needs.authorize.outputs.semantic_baseline_release_id }}
        with:
          script: |
            const stablePattern =
              /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
            const candidatePattern =
              /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))-rc\.[1-9]\d*$/u;
            const tuple = (tag) => {
              const match = stablePattern.exec(tag ?? "");
              return match
                ? [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])]
                : null;
            };
            const compare = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            };
            const candidateMatch = candidatePattern.exec(
              process.env.CANDIDATE_TAG ?? "",
            );
            const candidateVersion = candidateMatch
              ? tuple(`v${candidateMatch[1]}`)
              : null;
            const expectedReleaseId = Number(process.env.EXPECTED_RELEASE_ID);
            if (
              !candidateVersion
              || !Number.isSafeInteger(expectedReleaseId)
              || expectedReleaseId <= 0
            ) {
              throw new Error("candidate or predecessor identity is invalid");
            }
            const [refs, releases] = await Promise.all([
              github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/v",
                per_page: 100,
              }),
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2026-03-10" },
              }),
            ]);
            if (
              refs.some((ref) => {
                const version = tuple(
                  ref.ref?.replace(/^refs\/tags\//u, ""),
                );
                return version && compare(version, candidateVersion) >= 0;
              })
              || releases.some((release) => {
                const version = tuple(release.tag_name);
                return version && compare(version, candidateVersion) >= 0;
              })
            ) {
              throw new Error(
                "candidate version is no longer greater than every stable tag and release",
              );
            }
            const predecessors = releases.flatMap((release) => {
              const version = tuple(release.tag_name);
              return version && compare(version, candidateVersion) < 0
                ? [{ release, version }]
                : [];
            }).sort((left, right) => compare(right.version, left.version));
            const predecessor = predecessors[0]?.release;
            if (
              predecessor?.id !== expectedReleaseId
              || predecessor.tag_name
                !== process.env.RELEASE_SEMANTIC_BASELINE_STABLE_TAG
              || predecessor.draft !== false
              || predecessor.prerelease !== false
              || predecessor.immutable !== true
            ) {
              throw new Error(
                "authorized predecessor changed after the candidate build",
              );
            }
      - name: Reread and fence the controller and annotated candidate tag
        run: |
          git fetch --force origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "+refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
          test "$GITHUB_SHA" = "$CONTROLLER_REVISION"
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$CONTROLLER_REVISION"
          test "$(git rev-parse "refs/tags/$CANDIDATE_TAG")" = "$CANDIDATE_TAG_OBJECT"
          test "$(git cat-file -t "$CANDIDATE_TAG_OBJECT")" = "tag"
          test "$(git rev-parse "$CANDIDATE_TAG_OBJECT^{}")" = "$CANDIDATE_TAG_TARGET"
          test "$CANDIDATE_TAG_TARGET" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Refuse to overwrite differently bound GHCR aliases
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "the registry-free build did not expose an immutable image digest" >&2
            exit 1
          fi
          inspect_alias() {
            local alias_name="$1"
            local safe_name="${alias_name//[^0-9A-Za-z_.-]/_}"
            local descriptor_file="$RUNNER_TEMP/ghcr-$safe_name.json"
            local error_file="$RUNNER_TEMP/ghcr-$safe_name.err"
            if docker buildx imagetools inspect \
              "$IMAGE:$alias_name" \
              --format '{{json .Manifest}}' \
              > "$descriptor_file" 2> "$error_file"; then
              local observed
              observed="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const digest=value.digest??value.Digest; if(!/^sha256:[0-9a-f]{64}$/.test(digest??"")) throw new Error("registry alias descriptor has no immutable digest"); process.stdout.write(digest);' "$descriptor_file")"
              if [[ "$observed" != "$EXPECTED_DIGEST" ]]; then
                echo "$IMAGE:$alias_name already binds $observed, not $EXPECTED_DIGEST" >&2
                exit 1
              fi
            elif grep -Eiq 'manifest unknown|not found|404' "$error_file"; then
              :
            else
              cat "$error_file" >&2
              echo "could not determine whether $IMAGE:$alias_name already exists" >&2
              exit 1
            fi
          }
          inspect_alias "$CANDIDATE_TAG"
          inspect_alias "sha-$SOURCE_REVISION"
      - id: push
        name: Push the already-built candidate only after the final fence
        run: |
          CANDIDATE_PUSH_OUTPUT="$(docker push "$IMAGE:$CANDIDATE_TAG")"
          printf '%s\n' "$CANDIDATE_PUSH_OUTPUT"
          REVISION_PUSH_OUTPUT="$(docker push "$IMAGE:sha-$SOURCE_REVISION")"
          printf '%s\n' "$REVISION_PUSH_OUTPUT"
          CANDIDATE_DIGEST="$(printf '%s\n' "$CANDIDATE_PUSH_OUTPUT" | awk '/digest: sha256:/{print $2}' | tail -n 1)"
          REVISION_DIGEST="$(printf '%s\n' "$REVISION_PUSH_OUTPUT" | awk '/digest: sha256:/{print $2}' | tail -n 1)"
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$CANDIDATE_DIGEST" != "$REVISION_DIGEST" ]]; then
            echo "candidate tags did not publish the same immutable digest" >&2
            exit 1
          fi
          echo "digest=$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ needs.authorize.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write immutable artifact identity
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_WORKFLOW_CANDIDATE_SHA: ${{ needs.authorize.outputs.source_revision }}
          RELEASE_WORKFLOW_CANDIDATE_REF_NAME: ${{ needs.authorize.outputs.candidate_tag }}
        run: |
          node -e 'const fs=require("node:fs"); const value={schemaVersion:"genio-release-image/v2",candidateTag:process.env.CANDIDATE_TAG,sourceRevision:process.env.SOURCE_REVISION,image:`${process.env.IMAGE}@${process.env.IMAGE_DIGEST}`,semanticBaselineMetadataSha256:process.env.RELEASE_SEMANTIC_BASELINE_METADATA_SHA256,semanticBaselineStableTag:process.env.RELEASE_SEMANTIC_BASELINE_STABLE_TAG,semanticBaselineReleaseKeySha256:process.env.RELEASE_SEMANTIC_BASELINE_RELEASE_KEY_SHA256,semanticBaselineStableAuthorizerKeyId:process.env.RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_ID,semanticBaselineStableAuthorizerKeySha256:process.env.RELEASE_SEMANTIC_BASELINE_STABLE_AUTHORIZER_KEY_SHA256,semanticBaselinePredecessorMode:process.env.RELEASE_SEMANTIC_BASELINE_PREDECESSOR_MODE,semanticBaselineControllerSourceRevision:process.env.RELEASE_SEMANTIC_BASELINE_CONTROLLER_SOURCE_REVISION,semanticBaselineGithubAttestationVerificationBytesSha256:process.env.RELEASE_SEMANTIC_BASELINE_GITHUB_ATTESTATION_VERIFICATION_BYTES_SHA256,semanticBaselineHandoffSha256:process.env.RELEASE_SEMANTIC_BASELINE_HANDOFF_SHA256,releaseVerificationKeySha256:process.env.RELEASE_VERIFICATION_KEY_SHA256,publicRolloutIntentCanaryAuthorityPolicySha256:process.env.RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256,stableAuthorizerKeyId:process.env.RELEASE_STABLE_AUTHORIZER_KEY_ID,stableAuthorizerKeySha256:process.env.RELEASE_STABLE_AUTHORIZER_KEY_SHA256}; fs.writeFileSync("release-image.json",JSON.stringify(value,null,2)+"\n",{mode:0o600});'
          node --experimental-transform-types scripts/release-fixtures.ts offline --candidate-tag "$CANDIDATE_TAG" --source-revision "$SOURCE_REVISION" --image-digest "$IMAGE_DIGEST" --output release-offline-suite.json
          sha256sum release-offline-suite.json > release-offline-suite.sha256
      - id: offline_attestation
        name: Keylessly attest the offline suite
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ github.workspace }}/release-offline-suite.json
      - name: Verify and preserve the keyless offline-suite attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.offline_attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_REF: ${{ github.ref }}
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test -s "$ATTESTATION_BUNDLE"
          gh attestation verify release-offline-suite.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-ref "$TRUSTED_WORKFLOW_REF" \
            --source-digest "$TRUSTED_WORKFLOW_SHA" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --deny-self-hosted-runners \
            --format json > release-offline-suite.github-verification.json
          cp "$ATTESTATION_BUNDLE" release-offline-suite.github-attestation.json
          node -e 'const crypto=require("node:crypto"); const fs=require("node:fs"); const artifactSha256=crypto.createHash("sha256").update(fs.readFileSync("release-offline-suite.json")).digest("hex"); const value={schemaVersion:"genio-release-offline-attestation-binding/v1",repository:process.env.GITHUB_REPOSITORY,workflow:process.env.GITHUB_REPOSITORY+"/.github/workflows/release-candidate.yml",workflowRef:process.env.TRUSTED_WORKFLOW_REF,workflowSha:process.env.TRUSTED_WORKFLOW_SHA,candidateSourceRevision:process.env.SOURCE_REVISION,artifactSha256,predicateType:"https://slsa.dev/provenance/v1"}; fs.writeFileSync("release-offline-suite.github-binding.json",JSON.stringify(value,null,2)+"\n",{mode:0o600});'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ needs.authorize.outputs.candidate_tag }}
          path: |
            release-image.json
            release-offline-suite.json
            release-offline-suite.sha256
            release-offline-suite.github-attestation.json
            release-offline-suite.github-binding.json
            release-offline-suite.github-verification.json
            semantic-baseline-handoff/
          if-no-files-found: error
          retention-days: 7
