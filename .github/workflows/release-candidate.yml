        run: |
          node --experimental-transform-types --input-type=module -e 'import fs from "node:fs"; import { verifyHistoricalStablePredecessor } from "./scripts/historical-stable-predecessor.ts"; const directory="semantic-baseline-handoff"; const json=(name)=>JSON.parse(fs.readFileSync(`${directory}/${name}`,"utf8")); const result=verifyHistoricalStablePredecessor({evidence:json("finalization-evidence.json"),protectedBaselineMetadata:json("protected-semantic-baseline.json"),releaseVerificationKey:fs.readFileSync(`${directory}/release-verification-public-key.pem`),approvedReleaseKeySha256:process.env.EXPECTED_RELEASE_KEY_SHA256,authorization:json("stable-authorization.json"),stableAuthorizationVerificationKey:fs.readFileSync(`${directory}/stable-authorizer-public-key.pem`),approvedStableAuthorizerKeyId:process.env.EXPECTED_STABLE_AUTHORIZER_KEY_ID,approvedStableAuthorizerKeySha256:process.env.EXPECTED_STABLE_AUTHORIZER_KEY_SHA256,imageAttestation:json("stable-image-attestation.json"),storedConsumer:json("stable-release-consumer.json"),githubAttestationVerification:json("predecessor-image-attestation-verification.json"),expectedPredecessorRcTag:process.env.EXPECTED_PREDECESSOR_RC_TAG,expectedPredecessorVersion:process.env.EXPECTED_PREDECESSOR_VERSION,expectedPredecessorRevision:process.env.EXPECTED_PREDECESSOR_REVISION,expectedPredecessorImageDigest:process.env.EXPECTED_PREDECESSOR_IMAGE_DIGEST,expectedPredecessorImageReference:process.env.EXPECTED_PREDECESSOR_IMAGE_REFERENCE,expectedSuccessorRcTag:process.env.CANDIDATE_TAG,expectedSuccessorSourceRevision:process.env.CANDIDATE_SHA,expectedRepository:process.env.GITHUB_REPOSITORY,expectedDefaultBranch:process.env.DEFAULT_BRANCH,expectedControllerSourceRevision:process.env.EXPECTED_CONTROLLER_SOURCE_REVISION}); if(result.mode!==process.env.EXPECTED_PREDECESSOR_MODE) throw new Error("shared predecessor dispatcher mode differs from the exact schema pair");'
      - id: semantic_baseline_handoff
        name: Seal the exact semantic baseline handoff
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          PREDECESSOR_RELEASE_ID: ${{ steps.stable_predecessor.outputs.release_id }}
          PREDECESSOR_STABLE_TAG: ${{ steps.stable_predecessor.outputs.stable_tag }}
