name: v254 pre-exposure clean non-owner proof

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact merged v2.5.4 source revision
        required: true
        type: string
      release_version:
        description: Exact candidate version
        required: true
        type: string
      candidate_tag:
        description: Immutable RC tag
        required: true
        type: string
      image_digest:
        description: Immutable promoted backend image digest
        required: true
        type: string
      backend_promotion_run_id:
        description: Successful exact-image native schema20 promotion run
        required: true
        type: string
      sites_handoff_run_id:
        description: Successful exact-SHA Sites connector handoff run
        required: true
        type: string
      sites_handoff_artifact:
        description: Exact Sites connector handoff artifact
        required: true
        type: string
      route_authority_run_id:
        description: Successful paused public_canary route authority run
        required: true
        type: string
      route_authority_artifact:
        description: Exact paused public_canary route authority artifact
        required: true
        type: string

concurrency:
  group: v254-pre-exposure-clean-nonowner-${{ inputs.source_revision }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prove:
    name: signed zero-write typo and corrected UI probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PRODUCTION_ORIGIN: https://9enio.com
      RELEASE_CANARY_HMAC_SECRET: ${{ secrets.RELEASE_CANARY_HMAC_SECRET }}
      RELEASE_GATE_PRODUCER_KEY_ID: ${{ vars.RELEASE_GATE_PRODUCER_KEY_ID }}
      RELEASE_GATE_PRODUCER_KEY_SHA256: ${{ vars.RELEASE_GATE_PRODUCER_KEY_SHA256 }}
      RELEASE_SITES_CONTROL_PLANE_KEY_ID: ${{ vars.RELEASE_SITES_CONTROL_PLANE_KEY_ID }}
      RELEASE_SITES_CONTROL_PLANE_KEY_SHA256: ${{ vars.RELEASE_SITES_CONTROL_PLANE_KEY_SHA256 }}
      RELEASE_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/pre-exposure-browser
      SITES_PROJECT_ID: appgprj_6a5565cf7d6c8191ab9f2084e8eda856
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact candidate and successful upstream graph
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          BACKEND_RUN_ID: ${{ inputs.backend_promotion_run_id }}
          SITES_RUN_ID: ${{ inputs.sites_handoff_run_id }}
          SITES_ARTIFACT: ${{ inputs.sites_handoff_artifact }}
          ROUTE_RUN_ID: ${{ inputs.route_authority_run_id }}
          ROUTE_ARTIFACT: ${{ inputs.route_authority_artifact }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v"$RELEASE_VERSION"-rc\.[1-9][0-9]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SITES_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ROUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SITES_ARTIFACT" = "v254-sites-connector-handoff-$SOURCE_REVISION"
          test "$ROUTE_ARTIFACT" = "v254-pre-exposure-route-pause-public_canary-$SOURCE_REVISION"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$SOURCE_REVISION" "origin/$DEFAULT_BRANCH"
          git fetch --force origin "+refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"
          TAG_OBJECT="$(git rev-parse "refs/tags/$CANDIDATE_TAG")"
          test "$(git cat-file -t "$TAG_OBJECT")" = "tag"
          test "$(git rev-parse "$TAG_OBJECT^{}")" = "$SOURCE_REVISION"
          for RUN_ID in "$BACKEND_RUN_ID" "$SITES_RUN_ID" "$ROUTE_RUN_ID"; do
            RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            test "$(jq -r '.event' <<<"$RUN")" = "workflow_dispatch"
            test "$(jq -r '.status' <<<"$RUN")" = "completed"
            test "$(jq -r '.conclusion' <<<"$RUN")" = "success"
            test "$(jq -r '.head_sha' <<<"$RUN")" = "$SOURCE_REVISION"
          done
          BACKEND="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKEND_RUN_ID")"
          test "$(jq -r '.path' <<<"$BACKEND")" = ".github/workflows/native-schema20-release.yml"
          SITES="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SITES_RUN_ID")"
          test "$(jq -r '.path' <<<"$SITES")" = ".github/workflows/v254-sites-connector-handoff.yml"
          ROUTE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROUTE_RUN_ID")"
          test "$(jq -r '.path' <<<"$ROUTE")" = ".github/workflows/v254-pre-exposure-route-pause.yml"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-schema20-promotion-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/backend
          run-id: ${{ inputs.backend_promotion_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.sites_handoff_artifact }}
          path: ${{ runner.temp }}/sites
          run-id: ${{ inputs.sites_handoff_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.route_authority_artifact }}
          path: ${{ runner.temp }}/route
          run-id: ${{ inputs.route_authority_run_id }}
          github-token: ${{ github.token }}

      - name: Bind exact promotion, Sites, and paused route receipts
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          BACKEND="$RUNNER_TEMP/backend/native-schema20-promotion.json"
          SITES="$RUNNER_TEMP/sites/v254-sites-connector-handoff.json"
          ROUTE="$RUNNER_TEMP/route/v254-editorial-route-authority.json"
          jq -e \
            --arg sha "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            '.schemaVersion == "genio-native-schema20-promotion/v1"
             and .sourceRevision == $sha
             and .version == $version
             and .imageDigest == $digest
             and .environment == "production"
             and (.semanticBehaviorManifestHash | test("^[0-9a-f]{64}$"))
             and (.semanticExecutionConfigurationHash | test("^[0-9a-f]{64}$"))
             and (.backendConvergenceEvidenceHash | test("^[0-9a-f]{64}$"))
             and (.receiptHash | test("^[0-9a-f]{64}$"))
             and (.completedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' \
            "$BACKEND"
          BACKEND_RECEIPT_HASH="$(jq -er '.receiptHash' "$BACKEND")"
          BACKEND_SEMANTIC_HASH="$(jq -er '.semanticExecutionConfigurationHash' "$BACKEND")"
          BACKEND_COMPLETED_AT="$(jq -er '.completedAt' "$BACKEND")"
          jq -e \
            --arg sha "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$CANDIDATE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg project "$SITES_PROJECT_ID" \
            '.schemaVersion == "genio-v254-sites-connector-handoff/v1"
             and .candidate.sourceRevision == $sha
             and .candidate.sitesSourceRevision == $sha
             and .candidate.version == $version
             and .candidate.tag == $tag
             and .candidate.imageDigest == $digest
             and .projectId == $project
             and .connectorProduced == true
             and .importedVia == "bounded_workflow_dispatch_input"
             and (.sitesControlPlaneEvidenceHash | test("^[0-9a-f]{64}$"))
             and (.sitesControlPlaneAttestationPayloadHash | test("^[0-9a-f]{64}$"))
             and (.handoffHash | test("^[0-9a-f]{64}$"))
             and (.versionId | type == "string" and length > 0)
             and (.deploymentId | type == "string" and length > 0)
             and (.verifiedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' \
            "$SITES"
          SITES_VERIFIED_AT="$(jq -er '.verifiedAt' "$SITES")"
          jq -e \
            --arg sha "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            --arg digest "$IMAGE_DIGEST" \
            --arg promotion "$BACKEND_RECEIPT_HASH" \
            --arg semantic "$BACKEND_SEMANTIC_HASH" \
            '.schemaVersion == "genio-v254-editorial-route-authority/v1"
             and .phase == "public_canary"
             and .rollbackTarget == null
             and .sourceRevision == $sha
             and .version == $version
             and .imageDigest == $digest
             and .promotionReceiptHash == $promotion
             and .semanticExecutionConfigurationHash == $semantic
             and .applied == true
             and .database.hardSwitchDisabled == false
             and .database.globalPublicPause == true
             and .database.intentPublicPause == true
             and (.ownerGateReceiptHash | test("^[0-9a-f]{64}$"))
             and (.publicCanaryReceiptHash | test("^[0-9a-f]{64}$"))
             and (.proofEvidenceHash | test("^[0-9a-f]{64}$"))
             and (.rollingDeployGuardHash | test("^[0-9a-f]{64}$"))
             and (.receiptHash | test("^[0-9a-f]{64}$"))
             and (.completedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))' \
            "$ROUTE"
          ROUTE_COMPLETED_AT="$(jq -er '.completedAt' "$ROUTE")"
          test "$(date -u -d "$BACKEND_COMPLETED_AT" +%s)" \
            -le "$(date -u -d "$SITES_VERIFIED_AT" +%s)"
          test "$(date -u -d "$SITES_VERIFIED_AT" +%s)" \
            -le "$(date -u -d "$ROUTE_COMPLETED_AT" +%s)"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install exact dependencies and browser
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Require the exact typo and corrected clean-browser fixtures
        run: |
          set -euo pipefail
          node --experimental-transform-types --input-type=module -e '
            import { FINAL_PUBLIC_ASSIGNMENT_PROBE_FIXTURES_V1 as fixtures } from "./scripts/release-fixtures.ts";
            const expected = [
              ["final-public-assignment-editorial-influence-typo-v1", "Infuential irish music", 25],
              ["final-public-assignment-editorial-influence-corrected-v1", "Influential Irish music", 25],
            ];
            const actual = fixtures.map(({ fixtureId, prompt, targetTrackCount }) => [fixtureId, prompt, targetTrackCount]);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("pre-exposure browser fixture contract changed");
          '

      - name: Materialize and pin protected proof inputs
        env:
          RELEASE_SECRET_VERSIONS_BASE64: ${{ secrets.RELEASE_SECRET_VERSIONS_BASE64 }}
          RELEASE_GATE_PRODUCER_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GATE_PRODUCER_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SECRET_VERSIONS_BASE64"
          test -n "$RELEASE_GATE_PRODUCER_PRIVATE_KEY_BASE64"
          test -n "$RELEASE_CANARY_HMAC_SECRET"
          test "$(printf '%s' "$RELEASE_CANARY_HMAC_SECRET" | wc -c)" -ge 32
          [[ "$RELEASE_GATE_PRODUCER_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:-]{2,79}$ ]]
          [[ "$RELEASE_GATE_PRODUCER_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SITES_CONTROL_PLANE_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:+/-]{2,159}$ ]]
          [[ "$RELEASE_SITES_CONTROL_PLANE_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          printf '%s' "$RELEASE_SECRET_VERSIONS_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-secret-versions.json"
          printf '%s' "$RELEASE_GATE_PRODUCER_PRIVATE_KEY_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-gate-producer-private-key.pem"
          jq -e 'type == "object" and length > 0' \
            "$RUNNER_TEMP/release-secret-versions.json"
          OBSERVED_KEY_SHA256="$(
            node -e 'const c=require("node:crypto"),f=require("node:fs"); const k=c.createPrivateKey(f.readFileSync(process.argv[1])); if(k.asymmetricKeyType!=="ed25519") throw new Error("release gate key must be Ed25519"); process.stdout.write(c.createHash("sha256").update(c.createPublicKey(k).export({format:"der",type:"spki"})).digest("hex"));' \
              "$RUNNER_TEMP/release-gate-producer-private-key.pem"
          )"
          test "$OBSERVED_KEY_SHA256" = "$RELEASE_GATE_PRODUCER_KEY_SHA256"

      - name: Capture the exact pre-exposure runtime snapshot
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/release-runtime-snapshot.ts \
            --origin https://9enio.com \
            --environment production \
            --scope full \
            --expected-revision "$SOURCE_REVISION" \
            --expected-version "$RELEASE_VERSION" \
            --secret-versions "$RUNNER_TEMP/release-secret-versions.json" \
            --output "$RUNNER_TEMP/pre-exposure-runtime-snapshot.json"
          jq -e \
            --arg source "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            '.schemaVersion == "genio-release-runtime-snapshot/v3"
             and .environment == "production"
             and .scope == "full"
             and .candidate.sourceRevision == $source
             and .candidate.version == $version
             and .sitesObservation.sourceRevision == $source
             and .sitesObservation.version == $version
             and .sitesObservation.candidateMatched == true
             and .executorFencing.ready == true
             and .executorFencing.incompleteJobs == 0
             and .executorFencing.mismatchedActiveAttempts == 0
             and .executorFencing.uncoveredJobs == 0
             and .runtime.databaseSchemaVersion == "20"
             and .runtime.workerProtocol == "playlist-pipeline-v12"
             and (.snapshotHash | test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/pre-exposure-runtime-snapshot.json"
          ROUTE_SEMANTIC_HASH="$(
            jq -er '.semanticExecutionConfigurationHash' \
              "$RUNNER_TEMP/route/v254-editorial-route-authority.json"
          )"
          BACKEND_API_HASH="$(
            jq -er '.promotedRuntimeConfigurationHashes.api' \
              "$RUNNER_TEMP/backend/native-schema20-promotion.json"
          )"
          BACKEND_INTERACTIVE_HASH="$(
            jq -er '.promotedRuntimeConfigurationHashes.interactive' \
              "$RUNNER_TEMP/backend/native-schema20-promotion.json"
          )"
          BACKEND_DEEP_HASH="$(
            jq -er '.promotedRuntimeConfigurationHashes.deep' \
              "$RUNNER_TEMP/backend/native-schema20-promotion.json"
          )"
          jq -e \
            --arg semantic "$ROUTE_SEMANTIC_HASH" \
            --arg api "$BACKEND_API_HASH" \
            --arg interactive "$BACKEND_INTERACTIVE_HASH" \
            --arg deep "$BACKEND_DEEP_HASH" \
            '.runtime.semanticExecutionConfigurationHash == $semantic
             and .configuration.apiHash == $api
             and .configuration.interactiveWorkerHash == $interactive
             and .configuration.deepWorkerHash == $deep' \
            "$RUNNER_TEMP/pre-exposure-runtime-snapshot.json"

      - name: Produce signed clean non-owner zero-write browser proof
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          node --experimental-transform-types scripts/final-custom-domain-browser-producer.ts \
            --confirm-production-browser \
            --pre-exposure-clean-nonowner \
            --origin https://9enio.com \
            --expected-revision "$SOURCE_REVISION" \
            --expected-version "$RELEASE_VERSION" \
            --candidate-tag "$CANDIDATE_TAG" \
            --image-digest "$IMAGE_DIGEST" \
            --runtime-snapshot "$RUNNER_TEMP/pre-exposure-runtime-snapshot.json" \
            --sites-control-plane-evidence "$RUNNER_TEMP/sites/sites-control-plane.json" \
            --sites-control-plane-attestation "$RUNNER_TEMP/sites/sites-control-plane.attestation.json" \
            --sites-control-plane-verification-key "$RUNNER_TEMP/sites/sites-control-plane-public-key.pem" \
            --browser-artifact-dir "$RELEASE_BROWSER_ARTIFACT_DIR" \
            --source-output "$RUNNER_TEMP/pre-exposure-clean-nonowner.source.json" \
            --output "$RUNNER_TEMP/pre-exposure-clean-nonowner.gate.json" \
            --attestation-output "$RUNNER_TEMP/pre-exposure-clean-nonowner.attestation.json" \
            --producer-signing-key "$RUNNER_TEMP/release-gate-producer-private-key.pem" \
            --producer-key-id "$RELEASE_GATE_PRODUCER_KEY_ID"

      - name: Assert exact signed-canary, fresh-run, and Apple-write fences
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          GATE="$RUNNER_TEMP/pre-exposure-clean-nonowner.gate.json"
          jq -e \
            --arg source "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$CANDIDATE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            '.gate == "final_custom_domain_browser"
             and .environment == "production"
             and .candidate.sourceRevision == $source
             and .candidate.sitesSourceRevision == $source
             and .candidate.version == $version
             and .candidate.tag == $tag
             and .candidate.imageDigest == $digest
             and .sources.browser.schemaVersion == "genio-final-custom-domain-browser/v7"
             and .sources.browser.assignmentMode == "pre_exposure_release_canary"
             and .sources.browser.noDirectRailwayRequests == true
             and (.sources.browser.publicAssignmentProbes | length == 2)
             and (
               .sources.browser.publicAssignmentProbes
               | map(.fixtureId)
               | sort
             ) == [
               "final-public-assignment-editorial-influence-corrected-v1",
               "final-public-assignment-editorial-influence-typo-v1"
             ]
             and (
               .sources.browser.publicAssignmentProbes
               | all(
                   .intentGroup == "editorial_influence"
                   and .targetTrackCount == 25
                   and .rolloutEvidenceHash == null
                   and .rolloutStage == null
                   and .assignmentHash == null
                   and .assignmentAuthority == "signed_release_canary"
                   and (.assignmentReceiptHash | test("^[0-9a-f]{64}$"))
                   and .publicPercentageBypass == true
                   and .organicAssignment == false
                   and .contractVersion == 3
                   and .guidancePolicyVersion == "adaptive_guidance_v5"
                   and .axis == "influence_scope"
                   and .selectedOptionId == "balanced_influence"
                   and .answerAccepted == true
                   and (.successorContractHash | test("^[0-9a-f]{64}$"))
                   and (.queryPlanHash | test("^[0-9a-f]{64}$"))
                   and (.executionRouteReceiptHash | test("^[0-9a-f]{64}$"))
                   and (.runAccessIdHash | test("^[0-9a-f]{64}$"))
                   and (.workerConsumptionReceiptHash | test("^[0-9a-f]{64}$"))
                   and (.workerExecutionEffectHash | test("^[0-9a-f]{64}$"))
                   and (.workerResultEffectHash | test("^[0-9a-f]{64}$"))
                   and (.manifestCanaryEvidenceHash | test("^[0-9a-f]{64}$"))
                   and (.qualifiedManifestHash | test("^[0-9a-f]{64}$"))
                   and .selectedTrackCount == 25
                   and .reserveTrackCount >= 1
                   and .attemptCount >= 1
                   and .manifestOnly == true
                   and .appleWriteAccess == "forbidden"
                   and .autoPublish == false
                   and .manifestRows == 0
                   and .matchingJobs == 0
                   and .publicationJobs == 0
                   and .publicationVolumeRows == 0
                   and .orphanPlaylistRows == 0
                   and .noPublishedUi == true
                   and .runReused == false
                   and .realUiPath == true
                 )
             )
             and (.evidenceHash | test("^[0-9a-f]{64}$"))' \
            "$GATE"

      - name: Remove protected private inputs before upload
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/release-gate-producer-private-key.pem" \
            "$RUNNER_TEMP/release-secret-versions.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v254-pre-exposure-clean-nonowner-${{ inputs.source_revision }}
          path: |
            ${{ runner.temp }}/pre-exposure-clean-nonowner.source.json
            ${{ runner.temp }}/pre-exposure-clean-nonowner.gate.json
            ${{ runner.temp }}/pre-exposure-clean-nonowner.attestation.json
            ${{ runner.temp }}/pre-exposure-runtime-snapshot.json
            ${{ runner.temp }}/pre-exposure-browser
          if-no-files-found: error
          retention-days: 30
