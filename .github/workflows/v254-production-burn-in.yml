name: v254 production burn-in

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full merged v2.5.4 Git SHA already live
        required: true
        type: string
      release_version:
        description: Exact live release version
        required: true
        type: string
      candidate_tag:
        description: Immutable RC tag for the live candidate
        required: true
        type: string
      backend_promotion_run_id:
        description: Successful native schema20 promotion run
        required: true
        type: string
      direct_exposure_run_id:
        description: Successful signed direct-exposure transition run
        required: true
        type: string
      direct_exposure_artifact:
        description: Authority, warrant, runtime and DB activation artifact
        required: true
        type: string
      production_proof_run_id:
        description: Successful post-exposure v8 custom-domain proof run
        required: true
        type: string
      production_proof_artifact:
        description: Post-exposure v8 browser gate and attestation artifact
        required: true
        type: string
      prior_burn_in_run_id:
        description: Prior successful segment run, or 0 to start a new chain
        required: true
        default: "0"
        type: string

concurrency:
  group: v254-production-burn-in-${{ inputs.candidate_tag }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    name: bounded exact-candidate production monitor
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RELEASE_GATE_PRODUCER_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_GATE_PRODUCER_PUBLIC_KEY_BASE64 }}
      RELEASE_GATE_PRODUCER_KEY_ID: ${{ vars.RELEASE_GATE_PRODUCER_KEY_ID }}
      RELEASE_GATE_PRODUCER_KEY_SHA256: ${{ vars.RELEASE_GATE_PRODUCER_KEY_SHA256 }}
      RELEASE_DIRECT_EXPOSURE_VERIFICATION_KEY_BASE64: ${{ secrets.RELEASE_VERIFICATION_PUBLIC_KEY_BASE64 }}
      RELEASE_DIRECT_EXPOSURE_KEY_ID: ${{ vars.RELEASE_VERIFICATION_KEY_ID }}
      RELEASE_DIRECT_EXPOSURE_KEY_SHA256: ${{ vars.RELEASE_VERIFICATION_KEY_SHA256 }}
      RAILWAY_PROJECT_ID: 7e7a44ee-3e54-453c-9120-3cb1f33db76e
    steps:
      - name: Validate exact immutable selectors
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          BACKEND_RUN_ID: ${{ inputs.backend_promotion_run_id }}
          DIRECT_RUN_ID: ${{ inputs.direct_exposure_run_id }}
          DIRECT_ARTIFACT: ${{ inputs.direct_exposure_artifact }}
          PROOF_RUN_ID: ${{ inputs.production_proof_run_id }}
          PROOF_ARTIFACT: ${{ inputs.production_proof_artifact }}
          PRIOR_RUN_ID: ${{ inputs.prior_burn_in_run_id }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v"$RELEASE_VERSION"-rc\.[1-9][0-9]*$ ]]
          [[ "$BACKEND_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIRECT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$DIRECT_ARTIFACT" = "v254-editorial-direct-exposure-$SOURCE_REVISION"
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$PROOF_ARTIFACT" = "v254-production-proof-$SOURCE_REVISION"
          [[ "$PRIOR_RUN_ID" == "0" || "$PRIOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_GATE_PRODUCER_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:-]{2,79}$ ]]
          [[ "$RELEASE_GATE_PRODUCER_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_DIRECT_EXPOSURE_KEY_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._:+/-]{0,159}$ ]]
          [[ "$RELEASE_DIRECT_EXPOSURE_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RAILWAY_PROJECT_ID" =~ ^[0-9a-f-]{36}$ ]]
          test -n "$RAILWAY_TOKEN"
          test -n "$RELEASE_GATE_PRODUCER_PUBLIC_KEY_BASE64"
          test -n "$RELEASE_DIRECT_EXPOSURE_VERIFICATION_KEY_BASE64"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact merged candidate and immutable RC tag
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test "$(git rev-list -n 1 "$CANDIDATE_TAG")" = "$SOURCE_REVISION"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$SOURCE_REVISION" "origin/$DEFAULT_BRANCH"

      - name: Require successful immutable source evidence
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          BACKEND_RUN_ID: ${{ inputs.backend_promotion_run_id }}
          DIRECT_RUN_ID: ${{ inputs.direct_exposure_run_id }}
          PROOF_RUN_ID: ${{ inputs.production_proof_run_id }}
          PRIOR_RUN_ID: ${{ inputs.prior_burn_in_run_id }}
        run: |
          for RUN_ID in "$BACKEND_RUN_ID" "$DIRECT_RUN_ID" "$PROOF_RUN_ID"; do
            RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            test "$(jq -r '.status' <<<"$RUN")" = "completed"
            test "$(jq -r '.conclusion' <<<"$RUN")" = "success"
            test "$(jq -r '.head_sha' <<<"$RUN")" = "$SOURCE_REVISION"
          done
          BACKEND="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKEND_RUN_ID")"
          test "$(jq -r '.path' <<<"$BACKEND")" = ".github/workflows/native-schema20-release.yml"
          DIRECT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIRECT_RUN_ID")"
          test "$(jq -r '.path' <<<"$DIRECT")" = ".github/workflows/v254-editorial-direct-exposure.yml"
          PROOF="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN_ID")"
          test "$(jq -r '.path' <<<"$PROOF")" = ".github/workflows/v254-production-proof.yml"
          if [[ "$PRIOR_RUN_ID" != "0" ]]; then
            PRIOR="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID")"
            test "$(jq -r '.path' <<<"$PRIOR")" = ".github/workflows/v254-production-burn-in.yml"
            test "$(jq -r '.status' <<<"$PRIOR")" = "completed"
            test "$(jq -r '.conclusion' <<<"$PRIOR")" = "success"
            test "$(jq -r '.head_sha' <<<"$PRIOR")" = "$SOURCE_REVISION"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-schema20-promotion-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/backend
          run-id: ${{ inputs.backend_promotion_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.direct_exposure_artifact }}
          path: ${{ runner.temp }}/direct-exposure
          run-id: ${{ inputs.direct_exposure_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.production_proof_artifact }}
          path: ${{ runner.temp }}/browser
          run-id: ${{ inputs.production_proof_run_id }}
          github-token: ${{ github.token }}

      - name: Download prior chained checkpoint
        if: inputs.prior_burn_in_run_id != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v254-production-burn-in-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/prior
          run-id: ${{ inputs.prior_burn_in_run_id }}
          github-token: ${{ github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install exact lockfile and pinned Railway CLI
        run: |
          pnpm install --frozen-lockfile
          npm install --global @railway/cli@4.65.0
          test "$(railway --version)" = "railway 4.65.0"

      - name: Materialize protected verification keys
        run: |
          umask 077
          printf '%s' "$RELEASE_GATE_PRODUCER_PUBLIC_KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release-gate-producer-public-key.pem"
          printf '%s' "$RELEASE_DIRECT_EXPOSURE_VERIFICATION_KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/direct-exposure-verification-key.pem"

      - name: Monitor one bounded segment and fail on the first invariant trip
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PRIOR_RUN_ID: ${{ inputs.prior_burn_in_run_id }}
        run: |
          PRIOR_ARGS=()
          if [[ "$PRIOR_RUN_ID" != "0" ]]; then
            PRIOR_ARGS=(
              --prior-receipt
              "$RUNNER_TEMP/prior/v254-production-burn-in.json"
            )
          fi
          node --experimental-transform-types \
            scripts/v254-production-burn-in.ts monitor \
            --candidate-tag "$CANDIDATE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --version "$RELEASE_VERSION" \
            --backend-promotion "$RUNNER_TEMP/backend/native-schema20-promotion.json" \
            --direct-exposure-authority "$RUNNER_TEMP/direct-exposure/v254-direct-exposure-authority.json" \
            --direct-exposure-rollback-warrant "$RUNNER_TEMP/direct-exposure/v254-direct-exposure-rollback-warrant.json" \
            --direct-exposure-database-activate-receipt "$RUNNER_TEMP/direct-exposure/direct-exposure-database-activate.json" \
            --direct-exposure-runtime-receipt "$RUNNER_TEMP/direct-exposure/direct-exposure-runtime-apply.json" \
            --final-browser-artifact "$RUNNER_TEMP/browser/final-custom-domain-browser.gate.json" \
            --final-browser-attestation "$RUNNER_TEMP/browser/final-custom-domain-browser.attestation.json" \
            --producer-verification-key "$RUNNER_TEMP/release-gate-producer-public-key.pem" \
            --producer-key-id "$RELEASE_GATE_PRODUCER_KEY_ID" \
            --producer-key-sha256 "$RELEASE_GATE_PRODUCER_KEY_SHA256" \
            --direct-exposure-verification-key "$RUNNER_TEMP/direct-exposure-verification-key.pem" \
            --direct-exposure-key-id "$RELEASE_DIRECT_EXPOSURE_KEY_ID" \
            --direct-exposure-key-sha256 "$RELEASE_DIRECT_EXPOSURE_KEY_SHA256" \
            "${PRIOR_ARGS[@]}" \
            --project-id "$RAILWAY_PROJECT_ID" \
            --segment-seconds 19200 \
            --poll-interval-seconds 300 \
            --output "$RUNNER_TEMP/v254-production-burn-in.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v254-production-burn-in-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/v254-production-burn-in.json
          if-no-files-found: error
          retention-days: 30

      - name: Queue the next bounded segment only after preserving this checkpoint
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          BACKEND_RUN_ID: ${{ inputs.backend_promotion_run_id }}
          DIRECT_RUN_ID: ${{ inputs.direct_exposure_run_id }}
          DIRECT_ARTIFACT: ${{ inputs.direct_exposure_artifact }}
          PROOF_RUN_ID: ${{ inputs.production_proof_run_id }}
          PROOF_ARTIFACT: ${{ inputs.production_proof_artifact }}
        run: |
          STATUS="$(jq -r '.status' "$RUNNER_TEMP/v254-production-burn-in.json")"
          if [[ "$STATUS" == "complete" ]]; then
            exit 0
          fi
          test "$STATUS" = "monitoring"
          if ! gh workflow run v254-production-burn-in.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$CANDIDATE_TAG" \
              --field source_revision="$SOURCE_REVISION" \
              --field release_version="$RELEASE_VERSION" \
              --field candidate_tag="$CANDIDATE_TAG" \
              --field backend_promotion_run_id="$BACKEND_RUN_ID" \
              --field direct_exposure_run_id="$DIRECT_RUN_ID" \
              --field direct_exposure_artifact="$DIRECT_ARTIFACT" \
              --field production_proof_run_id="$PROOF_RUN_ID" \
              --field production_proof_artifact="$PROOF_ARTIFACT" \
              --field prior_burn_in_run_id="$GITHUB_RUN_ID"; then
            echo "::warning::The immutable checkpoint is preserved, but automatic resume failed. Dispatch the same workflow with prior_burn_in_run_id=$GITHUB_RUN_ID."
          fi
