name: exact SHA image

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full merged Git SHA to build
        required: true
        type: string
      release_version:
        description: Stable semantic version embedded in the image
        required: true
        type: string

concurrency:
  group: exact-sha-image-${{ inputs.source_revision }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: validate and build once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_reference: ${{ steps.receipt.outputs.image_reference }}
      image_digest: ${{ steps.receipt.outputs.image_digest }}
    steps:
      - name: Validate immutable inputs
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_VERIFICATION_KEY_SHA256: ${{ vars.RELEASE_VERIFICATION_KEY_SHA256 }}
          RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256: ${{ vars.RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "source_revision must be a lowercase full SHA-1" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "release_version must be a stable semantic version" >&2; exit 1; }
          [[ "$RELEASE_VERIFICATION_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "RELEASE_VERIFICATION_KEY_SHA256 must pin the rollout verification key" >&2; exit 1; }
          [[ "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 must pin the intent-canary authorities" >&2; exit 1; }
      - id: ci
        name: Require successful aggregate CI for the exact merged SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          RUNS="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_REVISION&status=completed&per_page=100"
          )"
          CHECKS_RUN_ID="$(
            jq -r \
              --arg sha "$SOURCE_REVISION" \
              --arg branch "$DEFAULT_BRANCH" \
              '[
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .head_branch == $branch
                    and .event == "push"
                    and .conclusion == "success"
                  )
              ]
              | sort_by(.run_attempt, .created_at)
              | last
              | .id // empty' <<<"$RUNS"
          )"
          [[ "$CHECKS_RUN_ID" =~ ^[0-9]+$ ]] \
            || {
              echo "No successful default-branch checks run exists for exact SHA $SOURCE_REVISION" >&2
              exit 1
            }
          ARTIFACTS="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECKS_RUN_ID/artifacts?per_page=100"
          )"
          ARTIFACT_ID="$(
            jq -r \
              --arg name "exact-sha-ci-$SOURCE_REVISION" \
              '[
                .artifacts[]
                | select(.name == $name and .expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id // empty' <<<"$ARTIFACTS"
          )"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] \
            || {
              echo "Successful checks run has no aggregate exact-SHA receipt" >&2
              exit 1
            }
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > exact-sha-ci-receipt.zip
          unzip -q exact-sha-ci-receipt.zip -d exact-sha-ci-receipt
          RECEIPT=exact-sha-ci-receipt/exact-sha-ci-receipt.json
          test -f "$RECEIPT"
          test "$(jq -r '.schemaVersion' "$RECEIPT")" = "genio-exact-sha-ci/v1"
          test "$(jq -r '.sourceRevision' "$RECEIPT")" = "$SOURCE_REVISION"
          test "$(jq -r '.event' "$RECEIPT")" = "push"
          test "$(jq -r '.headBranch' "$RECEIPT")" = "$DEFAULT_BRANCH"
          test "$(
            jq -r '[.gates[] | select(. != "success")] | length' "$RECEIPT"
          )" = "0"
          CI_RECEIPT_SHA256="$(sha256sum "$RECEIPT" | cut -d' ' -f1)"
          [[ "$CI_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "checks_run_id=$CHECKS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$CI_RECEIPT_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require merged exact source and matching version
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$SOURCE_REVISION" "origin/$DEFAULT_BRANCH"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test -f Dockerfile.ghcr-recovery
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push the exact source once
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_VERIFICATION_KEY_SHA256: ${{ vars.RELEASE_VERIFICATION_KEY_SHA256 }}
          RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256: ${{ vars.RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/genio
        run: |
          IMAGE_TAG="$IMAGE_NAME:sha-$SOURCE_REVISION"
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.ghcr-recovery \
            --build-arg "GENIO_BUILD_VERSION=$RELEASE_VERSION" \
            --build-arg "GENIO_BUILD_REVISION=$SOURCE_REVISION" \
            --build-arg "GENIO_RELEASE_VERIFICATION_KEY_SHA256=$RELEASE_VERIFICATION_KEY_SHA256" \
            --build-arg "GENIO_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256=$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" \
            --tag "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"
          IMAGE_REFERENCE="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          IMAGE_DIGEST="${IMAGE_REFERENCE##*@}"
          [[ "$IMAGE_REFERENCE" = "$IMAGE_NAME@$IMAGE_DIGEST" ]] \
            || { echo "pushed image reference did not resolve to the expected repository" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "docker push did not return an immutable digest" >&2; exit 1; }
          echo "image_reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - id: receipt
        name: Write immutable image receipt
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/genio
          CONTROLLER_REVISION: ${{ github.sha }}
          CHECKS_RUN_ID: ${{ steps.ci.outputs.checks_run_id }}
          CI_RECEIPT_SHA256: ${{ steps.ci.outputs.receipt_sha256 }}
          RELEASE_VERIFICATION_KEY_SHA256: ${{ vars.RELEASE_VERIFICATION_KEY_SHA256 }}
          RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256: ${{ vars.RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256 }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "build did not return an image digest" >&2; exit 1; }
          IMAGE_REFERENCE="$IMAGE_NAME@$IMAGE_DIGEST"
          jq -n \
            --arg schemaVersion "genio-exact-sha-image/v1" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg version "$RELEASE_VERSION" \
            --arg imageReference "$IMAGE_REFERENCE" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg controllerRevision "$CONTROLLER_REVISION" \
            --arg checksRunId "$CHECKS_RUN_ID" \
            --arg ciReceiptSha256 "$CI_RECEIPT_SHA256" \
            --arg releaseVerificationKeySha256 "$RELEASE_VERIFICATION_KEY_SHA256" \
            --arg publicRolloutIntentCanaryAuthorityPolicySha256 "$RELEASE_PUBLIC_ROLLOUT_INTENT_CANARY_AUTHORITY_POLICY_SHA256" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: $schemaVersion,
              sourceRevision: $sourceRevision,
              version: $version,
              imageReference: $imageReference,
              imageDigest: $imageDigest,
              controllerRevision: $controllerRevision,
              checksRunId: $checksRunId,
              ciReceiptSha256: $ciReceiptSha256,
              releaseVerificationKeySha256: $releaseVerificationKeySha256,
              publicRolloutIntentCanaryAuthorityPolicySha256: $publicRolloutIntentCanaryAuthorityPolicySha256,
              runUrl: $runUrl,
              createdAt: $createdAt
            }' \
            > exact-sha-image-receipt.json
          echo "image_reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Exact-SHA image"
            echo
            echo "- Source: \`$SOURCE_REVISION\`"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Image: \`$IMAGE_REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-sha-image-${{ inputs.source_revision }}
          path: exact-sha-image-receipt.json
          if-no-files-found: error
          retention-days: 30
